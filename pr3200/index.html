<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#101116"><title>Payments · LeuvenFlyers</title><style>
*{box-sizing:border-box}body{margin:0;background:#101116;color:#f5f5f7;font:14px/1.45 system-ui,-apple-system,sans-serif}main{max-width:480px;margin:auto;padding:20px 14px calc(24px + env(safe-area-inset-bottom))}header{text-align:center;margin:8px 0 22px}header p{color:#a5a7b4;font-size:11px;letter-spacing:2px;font-weight:800;margin:0}h1{font-size:29px;margin:4px 0 0;letter-spacing:-1px}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}button{font:700 14px system-ui;cursor:pointer;min-height:46px;border:0;border-radius:9px;touch-action:manipulation}.tab{border:1px solid var(--tone);color:var(--tone);background:transparent}.tab[aria-selected=true]{background:var(--tone);color:#151515}.yellow{--tone:#facc15}.green{--tone:#4ade80}.panel{background:#191b23;border:1px solid #30323e;border-radius:12px;padding:16px}.panel[hidden]{display:none}h2{font-size:17px;margin:0 0 15px;color:var(--tone)}label{display:block;font-size:12px;font-weight:650;color:#d3d5df;margin:0 0 13px}input{display:block;width:100%;margin-top:5px;background:#11131a;color:#fff;border:1px solid #414452;border-radius:8px;padding:11px 12px;min-height:46px;font:16px system-ui;outline:none}input:focus{border-color:var(--tone);box-shadow:0 0 0 2px color-mix(in srgb,var(--tone) 20%,transparent)}.send{width:100%;background:var(--tone);color:#131313;margin-top:3px}.hint{color:#a5a7b4;font-size:11px;text-align:center;margin:10px 0 0}.preview{margin-top:15px;border-top:1px solid #30323e;padding-top:12px}.preview summary{cursor:pointer;color:#b9bcc9;font-size:12px}.preview pre{white-space:pre-wrap;overflow-wrap:anywhere;font:11px/1.5 system-ui;color:#d5d7e0;margin:8px 0 0}.date-row{display:grid;grid-template-columns:0.85fr 1.65fr 1fr;gap:6px}.date-row label{min-width:0}.date-row select{display:block;width:100%;min-width:0;margin-top:5px;background:#11131a;color:#fff;border:1px solid #414452;border-radius:8px;padding:10px 5px;min-height:46px;font:16px system-ui;color-scheme:dark}.date-row select:focus{outline:2px solid var(--tone)}fieldset{border:0;padding:0;margin:0;min-width:0}legend{font-weight:700;font-size:12px;color:#d3d5df;margin-bottom:5px}button:focus-visible{outline:2px solid white;outline-offset:3px}
</style></head><body><main><header><p>LEUVENFLYERS</p><h1>Payments</h1></header><div class="tabs" role="tablist" aria-label="Payment type"><button class="tab yellow" id="contracts-tab" role="tab" aria-selected="true" aria-controls="contracts">Contracts</button><button class="tab green" id="money-tab" role="tab" aria-selected="false" aria-controls="money">Salary received</button></div>
<section class="panel yellow" id="contracts" role="tabpanel" aria-labelledby="contracts-tab"><h2>Details of contract</h2><form id="contract-form"><label>First name<input name="first" placeholder="Enter first name" autocomplete="given-name" required maxlength="80"></label><fieldset><legend>Contract date</legend><div class="date-row"><label>Day<select name="day" required></select></label><label>Month<select name="month" required></select></label><label>Year<select name="year" required></select></label></div></fieldset><label>Company name<input name="company" placeholder="Enter company name" required maxlength="160"></label><label>Hours registered<input name="hours" type="number" inputmode="decimal" min="0.01" step="any" placeholder="e.g. 3" required></label><label>Total net salary (€)<input name="net" inputmode="decimal" placeholder="e.g. 45.00" required></label><label>Total invoiced amount excluding VAT (€)<input name="invoice" inputmode="decimal" placeholder="e.g. 65.00" required></label><button class="send" type="submit">Send Email</button><p class="hint">Email will be prepared for info@leuvenflyers.com.</p><details class="preview"><summary>Email preview</summary><pre id="contract-preview"></pre></details></form></section>
<section class="panel green" id="money" role="tabpanel" aria-labelledby="money-tab" hidden><h2>Salary received</h2><form id="money-form"><fieldset><legend>Date salary received</legend><div class="date-row"><label>Day<select name="day" required></select></label><label>Month<select name="month" required></select></label><label>Year<select name="year" required></select></label></div></fieldset><label>First name<input name="first" autocomplete="given-name" placeholder="Enter first name" required maxlength="80"></label><label>Salary received (€)<input name="amount" inputmode="decimal" placeholder="e.g. 45.00" required></label><button class="send" type="submit">Send Email</button><p class="hint">Email will be prepared for info@leuvenflyers.com.</p><details class="preview"><summary>Email preview</summary><pre id="money-preview"></pre></details></form></section></main><script>
const tabs=[...document.querySelectorAll('[role=tab]')];function activate(t){tabs.forEach(b=>{const selected=b===t;b.setAttribute('aria-selected',String(selected));b.tabIndex=selected?0:-1;document.getElementById(b.getAttribute('aria-controls')).hidden=!selected;});}tabs.forEach((t,i)=>{t.addEventListener('click',()=>activate(t));t.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){e.preventDefault();const next=tabs[e.key==='Home'?0:e.key==='End'?1:1-i];activate(next);next.focus();}})});activate(tabs[0]);
const months=['January','February','March','April','May','June','July','August','September','October','November','December'];
function setupDate(form){const {day,month,year}=form.elements;const fill=(el,placeholder,options)=>{el.replaceChildren(new Option(placeholder,''),...options.map(([v,t])=>new Option(t,v)));};fill(month,'Month',months.map((m,i)=>[i+1,m]));fill(year,'Year',Array.from({length:5},(_,i)=>[2026+i,2026+i]));function days(){const old=day.value;const count=month.value?new Date(Number(year.value)||2028,Number(month.value),0).getDate():31;fill(day,'Day',Array.from({length:count},(_,i)=>[i+1,i+1]));if(Number(old)<=count)day.value=old;}days();month.addEventListener('change',days);year.addEventListener('change',days);}
function dateText(v){return v.day&&v.month&&v.year?`${v.day} ${months[Number(v.month)-1]} ${v.year}`:'—';}
for(const form of document.querySelectorAll('form'))setupDate(form);
function parseMoney(s){s=s.trim().replace(',','.');return /^\d+(?:\.\d{1,2})?$/.test(s)&&Number.isFinite(Number(s))?Number(s):null;}function euro(s){const n=parseMoney(s);return n===null?'€—':'€'+n.toFixed(2);}function build(form){const v=Object.fromEntries(new FormData(form));if(form.id==='contract-form')return {subject:'Contract Details – '+(v.company.trim()||'Company')+' – '+(v.first.trim()||'First name'),body:`Hello,\n\nPlease find the details of the contract below.\n\nFirst name: ${v.first.trim()||'—'}\nContract date: ${dateText(v)}\nCompany name: ${v.company.trim()||'—'}\nHours registered: ${v.hours||'—'}\nTotal net salary: ${euro(v.net)}\nTotal invoiced amount excluding VAT: ${euro(v.invoice)}\n\nKind regards,\n${v.first.trim()||'—'}`};return {subject:'Salary Received – '+(v.first.trim()||'First name'),body:`Hello,\n\nI confirm that I have received my salary of ${euro(v.amount)} on ${dateText(v)}.\n\nKind regards,\n${v.first.trim()||'—'}`};}
for(const form of document.querySelectorAll('form')){const preview=form.querySelector('pre');const update=()=>{const mail=build(form);preview.textContent='Subject: '+mail.subject+'\n\n'+mail.body;};const amounts=[...form.querySelectorAll('[inputmode=decimal]')].filter(i=>i.type!=='number');const names=[...form.querySelectorAll('input')].filter(i=>['company','first'].includes(i.name));function validate(){amounts.forEach(i=>i.setCustomValidity(parseMoney(i.value)!==null&&(i.name!=='amount'||parseMoney(i.value)>0)?'':'Enter a valid euro amount with up to two decimal places.'));names.forEach(i=>i.setCustomValidity(i.value.trim()?'':'Please enter a name.'));}form.addEventListener('input',()=>{validate();update();});form.addEventListener('change',()=>{validate();update();});form.addEventListener('submit',e=>{e.preventDefault();validate();if(!form.reportValidity())return;const mail=build(form);location.href='mailto:info@leuvenflyers.com?subject='+encodeURIComponent(mail.subject)+'&body='+encodeURIComponent(mail.body);});update();}
</script></body></html>


<!DOCTYPE html>
<html lang="en">
<head>
  <title>Segment Saver</title>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body{width:100%;height:100%;overflow:hidden;background:#0e1014;
      font-family:'Inter',system-ui,sans-serif;color:#e2e4f0}

    /* ── Map ── */
    #map{position:fixed;inset:0}

    /* ── Draw canvas ── */
    #dc{
      position:fixed;inset:0;z-index:20;
      pointer-events:none;
      cursor:crosshair;
    }
    body.drawing #dc{pointer-events:all}

    /* ── MapLibre tweaks ── */
    .maplibregl-ctrl-attrib{display:none!important}
    .maplibregl-ctrl-group{
      background:rgba(14,16,20,.9)!important;
      border:1px solid rgba(255,255,255,.12)!important;
      border-radius:9px!important;
      box-shadow:0 4px 16px rgba(0,0,0,.55)!important;
    }
    .maplibregl-ctrl-group button{background:transparent!important;color:#7788bb!important}
    .maplibregl-ctrl-group button:hover{background:rgba(255,255,255,.07)!important}

    /* ── Left sidebar ── */
    #sidebar{
      position:fixed;top:0;left:0;bottom:0;width:220px;
      background:rgba(14,16,20,.97);
      border-right:1px solid rgba(255,255,255,.09);
      z-index:100;
      display:flex;flex-direction:column;
      box-shadow:4px 0 24px rgba(0,0,0,.4);
    }

    .sb-head{
      padding:16px 16px 10px;
      border-bottom:1px solid rgba(255,255,255,.07);
    }
    .sb-title{font-size:14px;font-weight:700;color:#dde0ff;letter-spacing:.01em}
    .sb-sub{font-size:10px;color:#4a5580;margin-top:2px;font-weight:500}

    /* Mode badge */
    #modeBadge{
      margin:10px 16px 0;
      padding:5px 10px;border-radius:7px;
      font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
      display:none;align-items:center;gap:6px;
    }
    #modeBadge.draw{background:rgba(251,191,36,.14);border:1px solid rgba(251,191,36,.28);color:#fde68a;display:flex}
    #modeBadge.edit{background:rgba(239,68,68,.13);border:1px solid rgba(239,68,68,.26);color:#fca5a5;display:flex}
    #modeDot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
    #modeBadge.draw #modeDot{background:#fbbf24}
    #modeBadge.edit #modeDot{background:#ef4444;animation:blink 1.2s ease-in-out infinite}
    @keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}

    /* ── Buttons ── */
    .sb-section{
      padding:12px 12px 6px;
      border-bottom:1px solid rgba(255,255,255,.06);
    }
    .sb-section-label{
      font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
      color:#3a4466;margin-bottom:7px;padding-left:2px;
    }

    .btn{
      width:100%;padding:9px 12px;
      border-radius:8px;border:1px solid rgba(255,255,255,.09);
      background:rgba(255,255,255,.04);
      color:#c0c8f0;font-family:'Inter',sans-serif;
      font-size:11px;font-weight:600;
      display:flex;align-items:center;gap:7px;
      cursor:pointer;margin-bottom:5px;
      transition:background .12s,transform .07s,opacity .12s;
      outline:none;text-align:left;
    }
    .btn:last-child{margin-bottom:0}
    .btn:hover{background:rgba(255,255,255,.09);color:#fff}
    .btn:active{transform:scale(.96)}
    .btn:disabled{opacity:.3;cursor:not-allowed;transform:none}
    .btn.hidden{display:none}

    .btn.b-draw  {border-color:rgba(251,191,36,.25);background:rgba(251,191,36,.1);color:#fde68a}
    .btn.b-draw:hover{background:rgba(251,191,36,.18)}
    .btn.b-save  {border-color:rgba(34,197,94,.25);background:rgba(34,197,94,.1);color:#86efac}
    .btn.b-save:hover{background:rgba(34,197,94,.18)}
    .btn.b-undo  {border-color:rgba(192,132,252,.22);background:rgba(192,132,252,.09);color:#d8b4fe}
    .btn.b-undo:hover{background:rgba(192,132,252,.16)}
    .btn.b-del   {border-color:rgba(239,68,68,.22);background:rgba(239,68,68,.09);color:#fca5a5}
    .btn.b-del:hover{background:rgba(239,68,68,.17)}
    .btn.b-cancel{border-color:rgba(255,255,255,.07);color:#6b7280}
    .btn.b-cancel:hover{background:rgba(255,255,255,.07);color:#9ca3af}

    /* Layer toggle buttons */
    .btn.b-layer{border-color:rgba(96,165,250,.2);background:rgba(96,165,250,.06);color:#93b8f0}
    .btn.b-layer:hover{background:rgba(96,165,250,.13)}
    .btn.b-layer.on{border-color:rgba(96,165,250,.5);background:rgba(96,165,250,.18);color:#bfdbfe}
    .btn.b-layer.on .kbd{color:#93c5fd}

    .btn svg{width:14px;height:14px;flex-shrink:0;stroke:currentColor;fill:none;
             stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
    .btn-label{flex:1}

    .kbd{
      margin-left:auto;font-size:9px;font-weight:700;
      background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);
      border-radius:4px;padding:1px 5px;color:#5566aa;font-family:monospace;
    }

    /* Selection chips */
    .sel-chip{
      display:none;align-items:center;gap:6px;
      margin-top:2px;margin-bottom:5px;
      padding:5px 8px;border-radius:7px;
      font-size:10px;font-weight:600;
    }
    .sel-chip.show{display:flex}
    .sel-chip.muni{background:rgba(167,139,250,.1);border:1px solid rgba(167,139,250,.25);color:#c4b5fd}
    .sel-chip.zone{background:rgba(34,197,94,.09);border:1px solid rgba(34,197,94,.24);color:#86efac}
    .sel-chip .sel-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .sel-chip .sel-x{
      width:16px;height:16px;border-radius:5px;flex-shrink:0;
      display:flex;align-items:center;justify-content:center;
      background:rgba(255,255,255,.07);border:none;color:inherit;
      font-size:10px;font-weight:700;cursor:pointer;line-height:1;
      font-family:inherit;
    }
    .sel-chip .sel-x:hover{background:rgba(255,255,255,.16)}

    /* Edit info line */
    #editInfo{
      font-size:9px;color:#5566aa;font-weight:600;
      padding:2px 2px 4px;font-variant-numeric:tabular-nums;
    }

    /* ── Segment list ── */
    .sb-list{flex:1;overflow-y:auto;padding:8px 12px;scrollbar-width:thin;scrollbar-color:#222530 transparent}
    .sb-list::-webkit-scrollbar{width:4px}
    .sb-list::-webkit-scrollbar-thumb{background:#222530;border-radius:4px}

    .seg-item{
      display:flex;align-items:center;gap:8px;
      padding:6px 8px;border-radius:7px;
      border:1px solid transparent;
      cursor:pointer;margin-bottom:3px;
      transition:background .1s,border-color .1s;
    }
    .seg-item:hover{background:rgba(255,255,255,.05);border-color:rgba(255,255,255,.07)}
    .seg-item.active{background:rgba(239,68,68,.1);border-color:rgba(239,68,68,.25)}
    .seg-num{
      width:20px;height:20px;border-radius:50%;
      background:#1e2230;border:1.5px solid #3a4466;
      display:flex;align-items:center;justify-content:center;
      font-size:9px;font-weight:700;color:#5566aa;flex-shrink:0;
    }
    .seg-item.active .seg-num{background:rgba(239,68,68,.2);border-color:#ef4444;color:#fca5a5}
    .seg-name{font-size:11px;font-weight:500;color:#8899cc;flex:1}
    .seg-item.active .seg-name{color:#fca5a5}
    .seg-pts{font-size:9px;color:#3a4466;font-variant-numeric:tabular-nums}

    /* ── Status bar ── */
    #statusBar{
      padding:8px 14px;border-top:1px solid rgba(255,255,255,.07);
      font-size:10px;color:#3a4466;font-weight:500;
      display:flex;align-items:center;gap:6px;
    }
    #statusDot{width:6px;height:6px;border-radius:50%;background:#22c55e;flex-shrink:0}

    /* ── Help strip ── */
    #helpBar{
      position:fixed;bottom:0;left:220px;right:0;
      background:rgba(14,16,20,.88);
      border-top:1px solid rgba(255,255,255,.07);
      padding:6px 16px;z-index:90;
      display:flex;align-items:center;gap:16px;flex-wrap:wrap;
      font-size:10px;color:#3a4466;font-weight:500;
      backdrop-filter:blur(4px);
    }
    .help-item{display:flex;align-items:center;gap:5px}
    .help-key{
      background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);
      border-radius:4px;padding:1px 5px;font-size:9px;
      font-family:monospace;color:#5566aa;white-space:nowrap;
    }

    /* ── Toast ── */
    #toast{
      position:fixed;top:16px;left:50%;transform:translateX(-50%) translateY(-4px);
      background:rgba(14,16,20,.95);border:1px solid rgba(255,255,255,.12);
      color:#dde0ff;padding:7px 16px;border-radius:20px;
      font-size:11px;font-weight:500;z-index:500;
      pointer-events:none;backdrop-filter:blur(8px);
      white-space:nowrap;max-width:600px;
      opacity:0;transition:opacity .18s,transform .18s;
    }
    #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

    /* ── Segment endpoint markers ── */
    .ep{
      width:20px;height:20px;border-radius:50%;
      display:flex;align-items:center;justify-content:center;
      font-size:9px;font-weight:700;
      border:2px solid rgba(255,255,255,.8);
      box-shadow:0 2px 6px rgba(0,0,0,.6);
      pointer-events:none;
    }
    .ep.s{background:#fbbf24;color:#1a1000}
    .ep.e{background:#3b82f6;color:#fff}

    /* ── Edit handles — bigger hit area via padding-box trick ── */
    .hdl{
      width:14px;height:14px;border-radius:50%;
      background:#fff;border:2px solid #3b82f6;
      box-shadow:0 1px 5px rgba(0,0,0,.6);
      cursor:grab;
      /* invisible 8px halo makes them much easier to grab */
      background-clip:padding-box;
      outline:8px solid transparent;
    }
    .hdl:hover{background:#bfdbfe;transform:scale(1.35)}
    .hdl.drag{cursor:grabbing;background:#bfdbfe;transform:scale(1.45)}
    .hdl.mid{
      width:10px;height:10px;
      background:rgba(30,34,48,.85);
      border:2px dashed #60a5fa;
      opacity:.7;
    }
    .hdl.mid:hover{opacity:1;background:#1d4ed8;border-style:solid;transform:scale(1.45)}

    /* ── Municipality name labels ── */
    .muni-lbl{
      background:rgba(14,16,20,.85);border:1px solid rgba(167,139,250,.35);
      color:#c4b5fd;border-radius:9px;padding:1px 7px;
      font-size:9px;font-weight:700;white-space:nowrap;cursor:pointer;
      font-family:'Inter',sans-serif;
      box-shadow:0 1px 6px rgba(0,0,0,.5);
    }
    .muni-lbl.sel{background:rgba(167,139,250,.25);color:#ede9fe;border-color:#a78bfa}

    /* ── Loader ── */
    #loader{position:fixed;inset:0;z-index:999;background:#0e1014;
      display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
    #loader.gone{display:none}
    .spin{width:28px;height:28px;border-radius:50%;
      border:3px solid rgba(255,255,255,.08);border-top-color:#3b82f6;
      animation:spin .75s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    #loader p{font-size:11px;color:#3a4466;font-weight:500}
  </style>
</head>
<body>

<div id="loader"><div class="spin"></div><p>Loading…</p></div>
<div id="map"></div>
<canvas id="dc"></canvas>

<!-- ── Sidebar ── -->
<div id="sidebar">
  <div class="sb-head">
    <div class="sb-title">Segment Saver</div>
    <div class="sb-sub" id="sbSub">0 segments loaded</div>
  </div>

  <div id="modeBadge"><div id="modeDot"></div><span id="modeText">Drawing</span></div>

  <!-- Layers / area selection -->
  <div class="sb-section">
    <div class="sb-section-label">Area &amp; Zones</div>
    <button class="btn b-layer" id="bMunis">
      <svg viewBox="0 0 24 24"><path d="M3 9l9-6 9 6v11a1 1 0 01-1 1H4a1 1 0 01-1-1z"/><path d="M9 21V12h6v9"/></svg>
      <span class="btn-label">Municipalities</span>
      <span class="kbd">M</span>
    </button>
    <button class="btn b-layer" id="bZones">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
      <span class="btn-label">All Zones</span>
      <span class="kbd">A</span>
    </button>
    <div class="sel-chip muni" id="chipMuni">
      <span class="sel-name" id="chipMuniName"></span>
      <button class="sel-x" id="chipMuniX" title="Clear municipality">×</button>
    </div>
    <div class="sel-chip zone" id="chipZone">
      <span class="sel-name" id="chipZoneName"></span>
      <button class="sel-x" id="chipZoneX" title="Clear zone">×</button>
    </div>
  </div>

  <!-- Draw section -->
  <div class="sb-section" id="secIdle">
    <div class="sb-section-label">New Segment</div>
    <button class="btn b-draw" id="bDraw">
      <svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 013 3L7 19l-4 1 1-4z"/></svg>
      <span class="btn-label">Start Drawing</span>
      <span class="kbd">D</span>
    </button>
  </div>

  <div class="sb-section hidden" id="secDraw">
    <div class="sb-section-label">Drawing</div>
    <button class="btn b-save" id="bSaveNew">
      <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
      <span class="btn-label">Save Segment</span>
      <span class="kbd">S</span>
    </button>
    <button class="btn b-undo" id="bUndo">
      <svg viewBox="0 0 24 24"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 100-6.88"/></svg>
      <span class="btn-label">Undo Last</span>
      <span class="kbd">Z</span>
    </button>
    <button class="btn b-cancel" id="bCancelDraw">
      <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      <span class="btn-label">Cancel</span>
      <span class="kbd">Esc</span>
    </button>
  </div>

  <div class="sb-section hidden" id="secEdit">
    <div class="sb-section-label">Editing Segment</div>
    <div id="editInfo"></div>
    <button class="btn b-save" id="bSaveEdit">
      <svg viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
      <span class="btn-label">Save Changes</span>
      <span class="kbd">S</span>
    </button>
    <button class="btn b-undo" id="bSimplify">
      <svg viewBox="0 0 24 24"><path d="M4 17c4-8 12-8 16 0"/><circle cx="4" cy="17" r="2"/><circle cx="20" cy="17" r="2"/></svg>
      <span class="btn-label">Simplify Points</span>
      <span class="kbd">Q</span>
    </button>
    <button class="btn b-del" id="bDelete">
      <svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6M9 6V4h6v2"/></svg>
      <span class="btn-label">Delete</span>
      <span class="kbd">Del</span>
    </button>
    <button class="btn b-cancel" id="bCancelEdit">
      <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      <span class="btn-label">Discard Changes</span>
      <span class="kbd">Esc</span>
    </button>
  </div>

  <!-- Segment list -->
  <div class="sb-section" style="padding-bottom:6px">
    <div class="sb-section-label">All Segments</div>
  </div>
  <div class="sb-list" id="segList"></div>

  <div id="statusBar">
    <div id="statusDot"></div>
    <span id="statusTxt">Ready</span>
  </div>
</div>

<!-- Help bar -->
<div id="helpBar">
  <div class="help-item"><span class="help-key">M</span> Municipalities</div>
  <div class="help-item"><span class="help-key">A</span> All zones</div>
  <div class="help-item"><span class="help-key">Click seg</span> Edit</div>
  <div class="help-item"><span class="help-key">Click away</span> Auto-save edits</div>
  <div class="help-item"><span class="help-key">Drag dots</span> Move · dashed = insert</div>
  <div class="help-item"><span class="help-key">Right-click dot</span> Delete point</div>
  <div class="help-item"><span class="help-key">Q</span> Simplify</div>
  <div class="help-item"><span class="help-key">S</span> Save</div>
  <div class="help-item"><span class="help-key">Esc</span> Discard / cancel</div>
</div>

<div id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
'use strict';

// ═══════════════════════════════════════════
//  FIREBASE
// ═══════════════════════════════════════════
firebase.initializeApp({
  apiKey:"AIzaSyBHRyOy3hNcWarK8Zk34MWrv_tIYKM7mXM",
  authDomain:"leuvenflyers-23584.firebaseapp.com",
  databaseURL:"https://leuvenflyers-23584-default-rtdb.firebaseio.com",
  projectId:"leuvenflyers-23584",
  storageBucket:"leuvenflyers-23584.firebasestorage.app",
  messagingSenderId:"1077790950414",
  appId:"1:1077790950414:web:036fafe06df86f41ed285f"
});
const DB = firebase.database();

// ═══════════════════════════════════════════
//  MAP
// ═══════════════════════════════════════════
const map = new maplibregl.Map({
  container: 'map',
  style: {
    version: 8,
    glyphs: 'https://demotiles.maplibre.org/font/{fontstack}/{range}.pbf',
    sources: { osm: {
      type: 'raster', tileSize: 256,
      tiles: [
        'https://a.tile.openstreetmap.org/{z}/{x}/{y}.png',
        'https://b.tile.openstreetmap.org/{z}/{x}/{y}.png',
        'https://c.tile.openstreetmap.org/{z}/{x}/{y}.png'
      ]
    }},
    layers: [{ id:'osm', type:'raster', source:'osm',
               paint:{ 'raster-fade-duration': 0 } }]
  },
  center: [4.3517, 50.8503],
  zoom: 13, maxZoom: 19,
  attributionControl: false,
  fadeDuration: 0,
  dragRotate: false
});
map.addControl(new maplibregl.NavigationControl({ showCompass: false }), 'top-right');

map.getContainer().style.left = '220px';
map.getContainer().style.width = 'calc(100% - 220px)';

// ═══════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════
const segs    = {};       // fbKey → { coords:[[lng,lat]], endMarkers:[] }
let   segKeys = [];

// mode: 'idle' | 'drawing' | 'editing'
let mode       = 'idle';
let drawCoords = [];
let selKey     = null;
let editCoords = [];
let vHdls = [];           // vertex handle markers
let mHdls = [];           // midpoint handle markers
let pendingEditKey = null;

// Zones
const zones = {};
let zoneOrder = [];
let showZones = false;
let selZoneId = null;

// Municipalities
const MUNI_URL = 'https://public.opendatasoft.com/api/explore/v2.1/catalog/datasets/georef-belgium-municipality/exports/geojson?lang=en&timezone=UTC';
const MUNI_CACHE_KEY = 'be_munis_v1';
const munis = new Map();  // name → { name, geometry, center:[lng,lat] }
let muniLoaded = false, muniLoading = false;
let showMunis = false;
let selMuniName = null;
let muniLblMarkers = [];
const MUNI_LABEL_MIN_ZOOM = 9;
const MUNI_LABEL_MAX = 140;

// Canvas
const cvs = document.getElementById('dc');
const ctx = cvs.getContext('2d');

// ═══════════════════════════════════════════
//  UTILS
// ═══════════════════════════════════════════
const fc   = (fs=[]) => ({ type:'FeatureCollection', features:fs });
const feat = (t,c,p={}) => ({ type:'Feature', properties:p, geometry:{ type:t, coordinates:c } });

function parseCoords(raw) {
  const arr = Array.isArray(raw)
    ? raw
    : Object.keys(raw).filter(k=>!isNaN(+k)).sort((a,b)=>+a-+b).map(k=>raw[k]);
  return arr.map(p => [ +(p.lng??p[1]), +(p.lat??p[0]) ]);
}
function toFB(coords) { return coords.map(([lng,lat])=>({lat,lng})); }

let _tt;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(_tt);
  _tt = setTimeout(() => el.classList.remove('show'), 2600);
}

function setStatus(txt, ok=true) {
  document.getElementById('statusTxt').textContent = txt;
  document.getElementById('statusDot').style.background = ok ? '#22c55e' : '#f59e0b';
}

// Ray-cast point-in-ring
function pointInRing(pt, ring) {
  const [x, y] = pt; let inside = false;
  for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
    const xi = ring[i][0], yi = ring[i][1], xj = ring[j][0], yj = ring[j][1];
    if (((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi)) inside = !inside;
  }
  return inside;
}
function geomRings(geo) {
  if (!geo) return [];
  if (geo.type === 'Polygon')      return [geo.coordinates[0]];
  if (geo.type === 'MultiPolygon') return geo.coordinates.map(p => p[0]);
  if (geo.type === 'GeometryCollection' && Array.isArray(geo.geometries)) {
    let out = []; geo.geometries.forEach(g => { out = out.concat(geomRings(g)); }); return out;
  }
  return [];
}
function pointInGeom(pt, geo) { return geomRings(geo).some(r => pointInRing(pt, r)); }

function ringCenter(ring) {
  let sx = 0, sy = 0;
  ring.forEach(([lng,lat]) => { sx += lng; sy += lat; });
  return [sx / ring.length, sy / ring.length];
}
function fitRings(rings, opts={}) {
  let minLng=Infinity, minLat=Infinity, maxLng=-Infinity, maxLat=-Infinity, any=false;
  rings.forEach(ring => ring.forEach(([lng,lat]) => {
    any=true;
    if (lng<minLng) minLng=lng; if (lng>maxLng) maxLng=lng;
    if (lat<minLat) minLat=lat; if (lat>maxLat) maxLat=lat;
  }));
  if (any) map.fitBounds([[minLng,minLat],[maxLng,maxLat]],
    Object.assign({ padding:60, duration:700 }, opts));
}

// ── Douglas-Peucker simplification (iterative, no recursion) ──
// Traced strokes produce hundreds of points; ~2.5px tolerance keeps the shape
// visually identical while cutting points ~10x → far lighter storage, faster
// rendering, and a comfortable number of edit handles.
function rdpSimplify(pts, eps) {
  if (pts.length < 3) return pts.slice();
  const e2 = eps * eps;
  const d2Seg = (p, a, b) => {
    const dx = b[0]-a[0], dy = b[1]-a[1];
    const l2 = dx*dx + dy*dy;
    if (!l2) { const ex=p[0]-a[0], ey=p[1]-a[1]; return ex*ex+ey*ey; }
    let t = ((p[0]-a[0])*dx + (p[1]-a[1])*dy) / l2;
    t = t<0?0:(t>1?1:t);
    const px = a[0]+t*dx, py = a[1]+t*dy;
    const ex = p[0]-px, ey = p[1]-py;
    return ex*ex+ey*ey;
  };
  const keep = new Uint8Array(pts.length);
  keep[0] = keep[pts.length-1] = 1;
  const stack = [[0, pts.length-1]];
  while (stack.length) {
    const [s, e] = stack.pop();
    let maxD = 0, idx = -1;
    for (let i = s+1; i < e; i++) {
      const d = d2Seg(pts[i], pts[s], pts[e]);
      if (d > maxD) { maxD = d; idx = i; }
    }
    if (maxD > e2 && idx > 0) { keep[idx] = 1; stack.push([s, idx], [idx, e]); }
  }
  return pts.filter((_, i) => keep[i]);
}
// Convert a pixel tolerance at the current zoom to degrees
function pxToDeg(px) {
  const c = map.getCenter();
  const p = map.project([c.lng, c.lat]);
  const ll = map.unproject([p.x + px, p.y]);
  return Math.abs(ll.lng - c.lng);
}

// Municipality name — Opendatasoft exposes it in several shapes
function beMuniName(p) {
  if (!p) return null;
  const fromArr = v => {
    if (!Array.isArray(v) || !v.length) return null;
    if (typeof v[0] === 'string') return v[0];
    if (typeof v[0] === 'object') return v[0].name || v[0].label || null;
    return null;
  };
  return p.mun_name_nl || p.mun_name_fr
      || fromArr(p.mun_name)
      || (typeof p.mun_name === 'string' ? p.mun_name : null)
      || p.commune || p.gemeente || p.name
      || p.mun_refnis || null;
}

// ═══════════════════════════════════════════
//  CANVAS — resize + rAF-throttled redraw
// ═══════════════════════════════════════════
function resizeCvs() {
  const dpr = devicePixelRatio || 1;
  const W = window.innerWidth - 220;
  const H = window.innerHeight;
  cvs.style.left   = '220px';
  cvs.style.width  = W + 'px';
  cvs.style.height = H + 'px';
  cvs.width  = W * dpr;
  cvs.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  redrawCvs();
}
window.addEventListener('resize', resizeCvs);

let cvsRaf = 0;
function scheduleCvs() {
  if (cvsRaf) return;
  cvsRaf = requestAnimationFrame(() => { cvsRaf = 0; redrawCvs(); });
}
map.on('move', () => { if (mode === 'drawing') scheduleCvs(); });

function redrawCvs() {
  const W = window.innerWidth - 220;
  const H = window.innerHeight;
  ctx.clearRect(0, 0, W, H);
  if (drawCoords.length < 2) return;

  const pts = drawCoords.map(([lng,lat]) => map.project([lng,lat]));

  ctx.beginPath();
  pts.forEach((p,i) => i===0 ? ctx.moveTo(p.x,p.y) : ctx.lineTo(p.x,p.y));
  ctx.strokeStyle = 'rgba(251,191,36,0.35)';
  ctx.lineWidth   = 8;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  ctx.stroke();

  ctx.beginPath();
  pts.forEach((p,i) => i===0 ? ctx.moveTo(p.x,p.y) : ctx.lineTo(p.x,p.y));
  ctx.strokeStyle = '#fbbf24';
  ctx.lineWidth   = 3;
  ctx.stroke();

  ctx.beginPath(); ctx.arc(pts[0].x, pts[0].y, 6, 0, Math.PI*2);
  ctx.fillStyle = '#22c55e'; ctx.fill();
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; ctx.stroke();

  const ep = pts[pts.length-1];
  ctx.beginPath(); ctx.arc(ep.x, ep.y, 5, 0, Math.PI*2);
  ctx.fillStyle = '#f97316'; ctx.fill();
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; ctx.stroke();
}

// ═══════════════════════════════════════════
//  CANVAS EVENTS — click-to-toggle draw model
// ═══════════════════════════════════════════
let drawActive = false;
let lastPx2    = null;

function recordPoint(e) {
  const x = e.clientX - 220, y = e.clientY;
  if (lastPx2) {
    const dx = x - lastPx2.x, dy = y - lastPx2.y;
    if (dx*dx + dy*dy < 16) return;
  }
  const ll = map.unproject([x, y]);
  drawCoords.push([ll.lng, ll.lat]);
  lastPx2 = { x, y };
  scheduleCvs();
  setStatus(`Drawing… ${drawCoords.length} pts`);
}

function setDrawActive(active) {
  drawActive = active;
  if (active) {
    cvs.style.pointerEvents = 'all';
    cvs.style.cursor = 'crosshair';
    map.dragPan.disable();
    map.getCanvas().style.cursor = 'crosshair';
    setStatus(`Tracing… move mouse to draw. Click to pause.`);
    toast('Move mouse to trace the route. Click to pause.');
  } else {
    cvs.style.pointerEvents = 'none';
    cvs.style.cursor = 'default';
    map.dragPan.enable();
    map.getCanvas().style.cursor = '';
    if (drawCoords.length > 0)
      setStatus(`Paused — ${drawCoords.length} pts. Click map to resume.`);
    else
      setStatus('Click on map to start tracing');
  }
  syncUI();
}

cvs.addEventListener('click', e => {
  if (mode !== 'drawing' || !drawActive) return;
  e.preventDefault();
  e.stopPropagation();
  setDrawActive(false);
});
cvs.addEventListener('mousemove', e => {
  if (mode !== 'drawing' || !drawActive) return;
  recordPoint(e);
});
cvs.addEventListener('contextmenu', e => { e.preventDefault(); });

// ═══════════════════════════════════════════
//  MAP SOURCES + LAYERS
// ═══════════════════════════════════════════
map.on('load', () => {

  // ── Municipalities ──
  map.addSource('munis', { type:'geojson', data: fc() });
  map.addLayer({ id:'muni-fill', type:'fill', source:'munis',
    paint:{
      'fill-color': ['case',['get','sel'],'#a78bfa','#7c3aed'],
      'fill-opacity': ['case',['get','sel'],0.14,0.05]
    }
  });
  map.addLayer({ id:'muni-line', type:'line', source:'munis',
    paint:{
      'line-color': ['case',['get','sel'],'#a78bfa','#7c3aed'],
      'line-width': ['case',['get','sel'],2.5,1.5],
      'line-opacity': ['case',['get','sel'],1,0.7]
    }, layout:{ 'line-cap':'round','line-join':'round' }
  });

  // ── Zones ──
  map.addSource('zones', { type:'geojson', data: fc() });
  map.addLayer({ id:'zones-fill', type:'fill', source:'zones',
    paint:{
      'fill-color': ['case',['get','sel'],'#22c55e','#e63946'],
      'fill-opacity': ['case',['get','sel'],0.16,['case',['get','dim'],0.03,0.08]]
    }
  });
  map.addLayer({ id:'zones-glow', type:'line', source:'zones',
    paint:{
      'line-color': ['case',['get','sel'],'#22c55e','#e63946'],
      'line-width': 8,
      'line-opacity': ['case',['get','sel'],0.28,['case',['get','dim'],0.06,0.18]],
      'line-blur': 4
    }, layout:{ 'line-cap':'round', 'line-join':'round' }
  });
  map.addLayer({ id:'zones-line', type:'line', source:'zones',
    paint:{
      'line-color': ['case',['get','sel'],'#22c55e','#e63946'],
      'line-width': ['case',['get','sel'],3,2.5],
      'line-opacity': ['case',['get','sel'],1,['case',['get','dim'],0.3,0.85]]
    }, layout:{ 'line-cap':'round', 'line-join':'round' }
  });
  map.addLayer({ id:'zones-inner', type:'line', source:'zones',
    paint:{
      'line-color': ['case',['get','sel'],'#86efac','#ff6b7a'],
      'line-width': 1,
      'line-opacity': ['case',['get','sel'],0.7,['case',['get','dim'],0.15,0.5]]
    }, layout:{ 'line-cap':'round', 'line-join':'round' }
  });

  // ── Segments ──
  map.addSource('segs', { type:'geojson', data: fc() });
  map.addLayer({ id:'segs-shadow', type:'line', source:'segs',
    paint:{
      'line-color': 'rgba(0,0,0,0.55)',
      'line-width': ['case',['get','sel'],10,7],
      'line-blur': 5, 'line-offset': 2
    }, layout:{ 'line-cap':'round', 'line-join':'round' }
  });
  map.addLayer({ id:'segs-line', type:'line', source:'segs',
    paint:{
      'line-color': ['case',['get','sel'],'#ef4444','#111827'],
      'line-width': ['case',['get','sel'],5,3.5],
      'line-opacity':['case',['get','sel'],1,0.9]
    }, layout:{ 'line-cap':'round', 'line-join':'round' }
  });
  map.addLayer({ id:'segs-hi', type:'line', source:'segs',
    paint:{
      'line-color': ['case',['get','sel'],'rgba(255,255,255,0.35)','rgba(255,255,255,0.15)'],
      'line-width': 1,
      'line-opacity': 0.8
    }, layout:{ 'line-cap':'round', 'line-join':'round' }
  });

  // ── Edit line ──
  map.addSource('editLine', { type:'geojson', data: fc() });
  map.addLayer({ id:'edit-line', type:'line', source:'editLine',
    paint:{ 'line-color':'#ef4444', 'line-width':5, 'line-opacity':1 },
    layout:{ 'line-cap':'round', 'line-join':'round' }
  });

  // Hover cursors
  ['segs-line','zones-fill','muni-fill'].forEach(id => {
    map.on('mouseenter', id, ()=>{ if (mode==='idle') map.getCanvas().style.cursor='pointer'; });
    map.on('mouseleave', id, ()=>{ if (mode==='idle') map.getCanvas().style.cursor=''; });
  });

  // ── Unified click routing ──
  //  drawing  → start/resume trace
  //  editing  → click another segment = auto-save + switch; anything else = auto-save + exit
  //  idle     → segment > zone > municipality
  map.on('click', e => {
    if (mode === 'drawing') {
      if (drawActive) return;
      e.preventDefault();
      const ll = map.unproject([e.point.x, e.point.y]);
      drawCoords.push([ll.lng, ll.lat]);
      lastPx2 = { x: e.point.x, y: e.point.y };
      scheduleCvs();
      setDrawActive(true);
      return;
    }

    const q = layers => {
      const present = layers.filter(l => map.getLayer(l));
      return present.length ? map.queryRenderedFeatures(e.point, { layers: present }) : [];
    };

    const segHits = q(['segs-line','segs-shadow']);

    if (mode === 'editing') {
      if (segHits.length && segHits[0].properties.key !== selKey) {
        exitEdit(true);                         // auto-save current…
        enterEdit(segHits[0].properties.key);   // …then jump to the next one
      } else if (!segHits.length) {
        exitEdit(true);                         // click away = auto-save
      }
      return;
    }

    // idle
    if (segHits.length) { enterEdit(segHits[0].properties.key); return; }
    const zoneHits = q(['zones-fill']);
    if (zoneHits.length) { selectZone(zoneHits[0].properties.id); return; }
    const muniHits = q(['muni-fill']);
    if (muniHits.length) { selectMuni(muniHits[0].properties.name); return; }
  });

  // Municipality labels follow the viewport (debounced)
  let lblT;
  map.on('moveend', () => {
    if (!showMunis && !selMuniName) return;
    clearTimeout(lblT);
    lblT = setTimeout(renderMuniLabels, 120);
  });

  resizeCvs();
  loadZones();
  loadSegments();
  document.getElementById('loader').classList.add('gone');
  syncUI();
});

// ═══════════════════════════════════════════
//  MUNICIPALITIES
// ═══════════════════════════════════════════
async function loadMunis() {
  if (muniLoaded || muniLoading) return muniLoaded;
  muniLoading = true;
  setStatus('Loading municipalities…', false);
  let geo = null;
  try {
    const cached = sessionStorage.getItem(MUNI_CACHE_KEY);
    if (cached) geo = JSON.parse(cached);
  } catch(e){}
  if (!geo) {
    try {
      const r = await fetch(MUNI_URL, { mode:'cors' });
      if (r.ok) geo = await r.json();
      if (geo) { try { sessionStorage.setItem(MUNI_CACHE_KEY, JSON.stringify(geo)); } catch(e){} }
    } catch(e){ console.warn('muni fetch failed', e); }
  }
  muniLoading = false;
  if (!geo || !Array.isArray(geo.features)) {
    setStatus('Municipality data unavailable', false);
    toast('Could not load municipality boundaries.');
    return false;
  }
  geo.features.forEach(f => {
    const name = beMuniName(f.properties);
    const g = f.geometry;
    if (!name || !g) return;
    if (g.type !== 'Polygon' && g.type !== 'MultiPolygon') return;
    // Precompute label anchor once (centroid of the largest outer ring)
    const rings = geomRings(g);
    let big = rings[0] || null;
    rings.forEach(r => { if (r.length > big.length) big = r; });
    munis.set(String(name), {
      name: String(name), geometry: g,
      center: big ? ringCenter(big) : null
    });
  });
  muniLoaded = true;
  setStatus('Ready');
  return true;
}

function clearMuniLabels() { muniLblMarkers.forEach(m=>m.remove()); muniLblMarkers=[]; }

// Boundaries render as one GeoJSON layer (cheap); DOM name labels are limited
// to the current viewport + zoom threshold so we never mount ~580 markers.
function renderMunis() {
  if (!map.getSource('munis')) return;
  if (!showMunis && !selMuniName) {
    map.getSource('munis').setData(fc());
    clearMuniLabels();
    return;
  }
  const fs = [];
  munis.forEach(m => {
    const sel = m.name === selMuniName;
    if (!showMunis && !sel) return;
    fs.push({ type:'Feature', properties:{ name:m.name, sel }, geometry:m.geometry });
  });
  map.getSource('munis').setData(fc(fs));
  renderMuniLabels();
}

function renderMuniLabels() {
  clearMuniLabels();
  if (!showMunis && !selMuniName) return;
  const zoomOk = map.getZoom() >= MUNI_LABEL_MIN_ZOOM;
  const b = map.getBounds();
  let count = 0;
  munis.forEach(m => {
    const sel = m.name === selMuniName;
    if (!showMunis && !sel) return;
    if (!sel && !zoomOk) return;                 // selected label always shows
    if (!m.center) return;
    if (!b.contains(m.center)) return;
    if (!sel && count >= MUNI_LABEL_MAX) return;
    count++;
    const el = document.createElement('div');
    el.className = 'muni-lbl' + (sel ? ' sel' : '');
    el.textContent = m.name;
    el.addEventListener('click', ev => { ev.stopPropagation(); if (mode==='idle') selectMuni(m.name); });
    muniLblMarkers.push(
      new maplibregl.Marker({ element:el, anchor:'center' })
        .setLngLat(m.center).addTo(map)
    );
  });
}

async function selectMuni(name) {
  if (!name) return;
  if (selMuniName === name) {
    selMuniName = null;
    renderMunis(); renderZones(); syncUI();
    setStatus('Municipality cleared');
    return;
  }
  selMuniName = name;
  selZoneId = null;
  showZones = true;                              // auto-show zones inside it
  renderMunis();
  renderZones();
  syncUI();
  const m = munis.get(name);
  if (m) fitRings(geomRings(m.geometry), { maxZoom: 14 });
  const count = visibleZoneIds().length;
  setStatus(`${name} — ${count} zone${count!==1?'s':''} inside`);
  toast(`${name} selected — ${count} zone${count!==1?'s':''} shown. Click a zone, then press D to draw.`);
}

// ═══════════════════════════════════════════
//  ZONES
// ═══════════════════════════════════════════
function loadZones() {
  const sources = [
    { path:'polygons',      prefix:'P' },
    { path:'belgisubzones', prefix:'Z' }
  ];
  let done = 0;
  sources.forEach(({path, prefix}) => {
    DB.ref(path).once('value', snap => {
      let n = 0;
      snap.forEach(child => {
        const raw = child.val(); if (!raw || typeof raw !== 'object') return;
        const ring = Object.keys(raw)
          .filter(k=>!isNaN(+k)).sort((a,b)=>+a-+b)
          .map(k => { const p=raw[k]; return Array.isArray(p)?[+p[1],+p[0]]:[+(p.lng||0),+(p.lat||0)]; });
        if (ring.length < 3) return;
        if (ring[0][0]!==ring[ring.length-1][0] || ring[0][1]!==ring[ring.length-1][1]) ring.push([...ring[0]]);
        n++;
        const id = path + '/' + child.key;
        const name = (raw.zoneName && String(raw.zoneName).trim())
          ? String(raw.zoneName).trim()
          : prefix + n;
        zones[id] = { id, name, ring, center: ringCenter(ring), src: path };
        zoneOrder.push(id);
      });
      done++;
      if (done === sources.length) renderZones();
    });
  });
}

function visibleZoneIds() {
  const selGeo = selMuniName ? (munis.get(selMuniName)||{}).geometry : null;
  return zoneOrder.filter(id => {
    const z = zones[id];
    if (id === selZoneId) return true;
    if (!showZones) return false;
    if (selGeo) return pointInGeom(z.center, selGeo);
    return true;
  });
}

function renderZones() {
  if (!map.getSource('zones')) return;
  const ids = visibleZoneIds();
  map.getSource('zones').setData(fc(
    ids.map(id => {
      const z = zones[id];
      return feat('Polygon', [z.ring], {
        id, name: z.name,
        sel: id === selZoneId,
        dim: !!selZoneId && id !== selZoneId
      });
    })
  ));
}

function selectZone(id) {
  if (!id || !zones[id]) return;
  if (selZoneId === id) {
    selZoneId = null;
    renderZones(); syncUI();
    setStatus('Zone cleared');
    return;
  }
  selZoneId = id;
  renderZones(); syncUI();
  fitRings([zones[id].ring], { maxZoom: 16.5 });
  setStatus(`Zone ${zones[id].name} selected — press D to draw`);
  toast(`Zone ${zones[id].name} selected. Press D to trace your segment inside it.`);
}

// ═══════════════════════════════════════════
//  SEGMENTS SOURCE
// ═══════════════════════════════════════════
function refreshSegs() {
  if (!map.getSource('segs')) return;
  map.getSource('segs').setData(fc(
    segKeys.map((key,i) => {
      const s = segs[key];
      if (!s || s.coords.length < 2) return null;
      return feat('LineString', s.coords, { key, sel: key===selKey, idx: i+1 });
    }).filter(Boolean)
  ));
  const n = segKeys.length;
  document.getElementById('sbSub').textContent = n + ' segment' + (n!==1?'s':'') + ' loaded';
  renderSegList();
}

// ═══════════════════════════════════════════
//  SEGMENT LIST
// ═══════════════════════════════════════════
function renderSegList() {
  const list = document.getElementById('segList');
  list.innerHTML = '';
  if (!segKeys.length) {
    list.innerHTML = '<div style="font-size:10px;color:#2a3050;padding:4px 2px">No segments yet</div>';
    return;
  }
  const frag = document.createDocumentFragment();
  segKeys.forEach((key,i) => {
    const s = segs[key];
    if (!s) return;
    const el = document.createElement('div');
    el.className = 'seg-item' + (key===selKey?' active':'');
    el.innerHTML = `
      <div class="seg-num">${i+1}</div>
      <div class="seg-name">Segment ${i+1}</div>
      <div class="seg-pts">${s.coords.length}pts</div>`;
    el.addEventListener('click', () => {
      if (mode==='drawing') return;
      if (key===selKey) { exitEdit(true); return; }        // clicking active row saves & closes
      if (mode==='editing') exitEdit(true);                // auto-save before switching
      enterEdit(key);
      fitRings([segs[key].coords], { maxZoom: 17 });
    });
    frag.appendChild(el);
  });
  list.appendChild(frag);
}

// ═══════════════════════════════════════════
//  ENDPOINT MARKERS
// ═══════════════════════════════════════════
function addEndpts(key) {
  const s = segs[key]; if (!s || !s.coords.length) return;
  const n = segKeys.indexOf(key)+1;
  const mk = (coord, cls) => {
    const el = document.createElement('div');
    el.className = 'ep ' + cls; el.textContent = n;
    return new maplibregl.Marker({ element:el, anchor:'center' })
      .setLngLat(coord).addTo(map);
  };
  s.endMarkers = [ mk(s.coords[0], 's') ];
  if (s.coords.length > 1)
    s.endMarkers.push(mk(s.coords[s.coords.length-1], 'e'));
}
function remEndpts(key) {
  const s = segs[key]; if (!s) return;
  s.endMarkers.forEach(m=>m.remove()); s.endMarkers=[];
}
function renumber() { segKeys.forEach(k=>{ remEndpts(k); addEndpts(k); }); }

// ═══════════════════════════════════════════
//  EDIT MODE
//  Fast + easy model:
//   • click a segment → handles appear (few, thanks to simplification)
//   • drag white dots to move; adjacent midpoints follow live (no rebuild)
//   • drag dashed dots to insert a point exactly there
//   • right-click a dot to delete it
//   • click ANYWHERE else → changes AUTO-SAVE (Esc discards)
//   • Q simplifies the shape further at any time
// ═══════════════════════════════════════════
function enterEdit(key) {
  if (mode==='editing') exitEdit(true);
  selKey = key; mode = 'editing';
  editCoords = segs[key].coords.map(c=>[...c]);
  remEndpts(key);
  buildHdls();
  refreshSegs(); updateEditLine();
  syncUI();
  setStatus('Editing segment ' + (segKeys.indexOf(key)+1), true);
  toast('Drag dots · dashed dots insert · right-click deletes · click away to auto-save.');
}

function exitEdit(save) {
  clearHdls();
  if (selKey) {
    if (save) {
      const changed = JSON.stringify(editCoords) !== JSON.stringify(segs[selKey].coords);
      if (changed) {
        segs[selKey].coords = editCoords.map(c=>[...c]);
        DB.ref('segments/'+selKey).set(toFB(editCoords))
          .then(()=>toast('✓ Saved')).catch(()=>toast('Save failed.'));
      }
    }
    addEndpts(selKey);
  }
  selKey=null; editCoords=[]; mode='idle';
  if (map.getSource('editLine')) map.getSource('editLine').setData(fc());
  refreshSegs(); syncUI();
  setStatus('Ready');
}

const midOf = i => [
  (editCoords[i][0]+editCoords[i+1][0])/2,
  (editCoords[i][1]+editCoords[i+1][1])/2
];

function buildHdls() {
  clearHdls();

  // Vertex handles — drag updates only itself + the two neighbouring midpoints
  editCoords.forEach((coord,i) => {
    const el = document.createElement('div'); el.className='hdl';
    const m = new maplibregl.Marker({ element:el, anchor:'center', draggable:true })
      .setLngLat(coord).addTo(map);
    m.on('drag', ()=>{
      const ll=m.getLngLat();
      editCoords[i]=[ll.lng,ll.lat];
      if (mHdls[i-1]) mHdls[i-1].setLngLat(midOf(i-1));
      if (mHdls[i])   mHdls[i].setLngLat(midOf(i));
      scheduleEditLine();
    });
    m.on('dragstart', ()=>el.classList.add('drag'));
    m.on('dragend',   ()=>el.classList.remove('drag'));   // no rebuild needed
    el.addEventListener('contextmenu', e => {
      e.preventDefault(); e.stopPropagation();
      if (editCoords.length <= 2) { toast('A segment needs at least 2 points.'); return; }
      editCoords.splice(i, 1);
      updateEditLine();
      buildHdls();
      syncEditInfo();
    });
    vHdls.push(m);
  });

  // Midpoint handles — drag to insert a new vertex right there
  for (let i = 0; i < editCoords.length - 1; i++) {
    const el = document.createElement('div'); el.className='hdl mid';
    const m = new maplibregl.Marker({ element:el, anchor:'center', draggable:true })
      .setLngLat(midOf(i)).addTo(map);
    let at = -1;
    m.on('dragstart', () => {
      el.classList.add('drag');
      at = i + 1;
      editCoords.splice(at, 0, midOf(i));
    });
    m.on('drag', () => {
      if (at < 0) return;
      const ll = m.getLngLat();
      editCoords[at] = [ll.lng, ll.lat];
      scheduleEditLine();
    });
    m.on('dragend', () => {
      el.classList.remove('drag');
      at = -1;
      buildHdls();                    // one cheap rebuild only when a point is added
      syncEditInfo();
    });
    mHdls.push(m);
  }
  syncEditInfo();
}
function clearHdls() { [...vHdls, ...mHdls].forEach(m=>m.remove()); vHdls=[]; mHdls=[]; }

let editLineRaf = 0;
function scheduleEditLine() {
  if (editLineRaf) return;
  editLineRaf = requestAnimationFrame(() => { editLineRaf = 0; updateEditLine(); });
}
function updateEditLine() {
  if (!map.getSource('editLine') || editCoords.length<2) return;
  map.getSource('editLine').setData(fc([feat('LineString',editCoords)]));
}
function syncEditInfo() {
  const el = document.getElementById('editInfo');
  if (el) el.textContent = editCoords.length ? editCoords.length + ' points' : '';
}

function simplifyEdit() {
  if (mode !== 'editing' || editCoords.length < 4) { toast('Nothing to simplify.'); return; }
  const before = editCoords.length;
  const out = rdpSimplify(editCoords, pxToDeg(3));
  if (out.length >= 2 && out.length < before) {
    editCoords = out;
    updateEditLine();
    buildHdls();
    toast(`Simplified: ${before} → ${out.length} points.`);
  } else {
    toast('Already simple.');
  }
}

// ═══════════════════════════════════════════
//  DRAW MODE
// ═══════════════════════════════════════════
function enterDraw() {
  if (mode==='editing') exitEdit(true);
  drawCoords=[]; drawActive=false; lastPx2=null; mode='drawing';
  document.body.classList.add('drawing');
  cvs.style.pointerEvents = 'none';
  map.dragPan.enable();
  if (selZoneId && zones[selZoneId]) fitRings([zones[selZoneId].ring], { maxZoom: 16.5, duration: 500 });
  resizeCvs();
  syncUI();
  setStatus(selZoneId && zones[selZoneId]
    ? `Zone ${zones[selZoneId].name} — click on map to start tracing`
    : 'Click on map to start tracing');
  toast('Click anywhere on the map to start drawing your segment.');
}

function cancelDraw() {
  drawCoords=[]; drawActive=false; lastPx2=null; mode='idle';
  document.body.classList.remove('drawing');
  cvs.style.pointerEvents = 'none';
  cvs.style.cursor = 'default';
  map.dragPan.enable();
  map.getCanvas().style.cursor = '';
  const W = window.innerWidth-220, H = window.innerHeight;
  ctx.clearRect(0, 0, W, H);
  syncUI(); setStatus('Ready');
}

function saveNewSeg() {
  if (drawCoords.length < 2) { toast('Draw more points first.'); return; }
  // Simplify the raw trace before saving — same visual shape, ~10x fewer
  // points → smaller Firebase payload and a clean, editable set of handles.
  const before = drawCoords.length;
  let coords = rdpSimplify(drawCoords, pxToDeg(2.5));
  if (coords.length < 2) coords = drawCoords.map(c=>[...c]);
  cancelDraw();
  const ref = DB.ref('segments').push();
  pendingEditKey = ref.key;
  ref.set(toFB(coords))
    .then(()=>toast(`✓ Saved (${before} → ${coords.length} pts). Fine-tune the dots or click away.`))
    .catch(()=>{ pendingEditKey=null; toast('Save failed.'); });
}

function undoDraw() {
  if (drawCoords.length < 2) return;
  const n = Math.max(1, Math.floor(drawCoords.length*0.08));
  drawCoords.splice(-n, n);
  scheduleCvs();
  toast(`Undid ~${n} points. ${drawCoords.length} remaining.`);
}

function deleteSelected() {
  if (!selKey) return;
  if (!confirm('Delete this segment?')) return;
  const k = selKey; exitEdit(false);
  DB.ref('segments/'+k).remove()
    .then(()=>toast('Deleted.')).catch(()=>toast('Delete failed.'));
}

// ═══════════════════════════════════════════
//  UI SYNC
// ═══════════════════════════════════════════
function syncUI() {
  const s = (id,vis) => {
    const el=document.getElementById(id);
    if(el) el.classList.toggle('hidden',!vis);
  };
  s('secIdle',  mode==='idle');
  s('secDraw',  mode==='drawing');
  s('secEdit',  mode==='editing');

  const mb = document.getElementById('modeBadge');
  if (mode==='drawing') {
    mb.className='draw'; mb.style.display='flex';
    document.getElementById('modeText').textContent = drawActive ? 'Tracing…' : 'Draw Mode';
  } else if (mode==='editing') {
    mb.className='edit'; mb.style.display='flex';
    document.getElementById('modeText').textContent='Editing Mode';
  } else {
    mb.style.display='none';
  }

  document.getElementById('bMunis').classList.toggle('on', showMunis);
  document.getElementById('bZones').classList.toggle('on', showZones);

  const cm = document.getElementById('chipMuni');
  cm.classList.toggle('show', !!selMuniName);
  document.getElementById('chipMuniName').textContent = selMuniName ? ('⌂ ' + selMuniName) : '';
  const cz = document.getElementById('chipZone');
  cz.classList.toggle('show', !!selZoneId);
  document.getElementById('chipZoneName').textContent =
    selZoneId && zones[selZoneId] ? ('▣ Zone ' + zones[selZoneId].name) : '';

  renderSegList();
}

// ═══════════════════════════════════════════
//  BUTTON WIRING
// ═══════════════════════════════════════════
document.getElementById('bDraw')      .onclick = enterDraw;
document.getElementById('bSaveNew')   .onclick = saveNewSeg;
document.getElementById('bUndo')      .onclick = undoDraw;
document.getElementById('bCancelDraw').onclick = cancelDraw;
document.getElementById('bSaveEdit')  .onclick = ()=>exitEdit(true);
document.getElementById('bSimplify')  .onclick = simplifyEdit;
document.getElementById('bDelete')    .onclick = deleteSelected;
document.getElementById('bCancelEdit').onclick = ()=>exitEdit(false);

document.getElementById('bMunis').onclick = async () => {
  showMunis = !showMunis;
  syncUI();
  if (showMunis) {
    const ok = await loadMunis();
    if (!ok) { showMunis=false; syncUI(); return; }
    renderMunis();
    if (!selMuniName) toast('Click a municipality to select it — its zones appear automatically.');
  } else {
    renderMunis();
  }
};

document.getElementById('bZones').onclick = () => {
  showZones = !showZones;
  if (!showZones) { selZoneId = null; }
  renderZones();
  syncUI();
  if (showZones) {
    const ids = visibleZoneIds();
    if (ids.length) {
      fitRings(ids.map(id=>zones[id].ring), { maxZoom: 14 });
      toast(`${ids.length} zone${ids.length!==1?'s':''} shown — click one to select where you want to draw.`);
    } else {
      toast('No zones found' + (selMuniName ? ' in ' + selMuniName : '') + '.');
    }
  }
};

document.getElementById('chipMuniX').onclick = () => {
  selMuniName = null;
  renderMunis(); renderZones(); syncUI();
  setStatus('Municipality cleared');
};
document.getElementById('chipZoneX').onclick = () => {
  selZoneId = null;
  renderZones(); syncUI();
  setStatus('Zone cleared');
};

document.getElementById('sidebar').addEventListener('mousedown', e=>e.stopPropagation());

// ═══════════════════════════════════════════
//  KEYBOARD SHORTCUTS
// ═══════════════════════════════════════════
document.addEventListener('keydown', e => {
  if (e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA') return;
  if (e.key==='d'||e.key==='D') { if (mode==='idle') enterDraw(); }
  if (e.key==='m'||e.key==='M') { if (mode==='idle') document.getElementById('bMunis').click(); }
  if (e.key==='a'||e.key==='A') { if (mode==='idle') document.getElementById('bZones').click(); }
  if (e.key==='q'||e.key==='Q') { if (mode==='editing') simplifyEdit(); }
  if (e.key==='s'||e.key==='S') {
    if (mode==='drawing') saveNewSeg();
    else if (mode==='editing') exitEdit(true);
  }
  if ((e.key==='z'||e.key==='Z') && mode==='drawing') undoDraw();
  if (e.key==='Escape') {
    if (mode==='drawing') cancelDraw();
    else if (mode==='editing') exitEdit(false);   // Esc = discard changes
  }
  if (e.key==='Delete' && mode==='editing') deleteSelected();
});

// ═══════════════════════════════════════════
//  FIREBASE — SEGMENTS
// ═══════════════════════════════════════════
function loadSegments() {
  DB.ref('segments').on('child_added', snap => {
    const c = parseCoords(snap.val()); if (c.length<2) return;
    segs[snap.key] = { coords:c, endMarkers:[] };
    segKeys.push(snap.key);
    addEndpts(snap.key);
    refreshSegs();
    if (pendingEditKey && snap.key === pendingEditKey) {
      pendingEditKey = null;
      enterEdit(snap.key);
    }
  });
  DB.ref('segments').on('child_changed', snap => {
    if (!segs[snap.key]) return;
    // Ignore the echo of our own in-progress save
    if (snap.key === selKey && mode === 'editing') return;
    remEndpts(snap.key);
    segs[snap.key].coords = parseCoords(snap.val());
    addEndpts(snap.key);
    refreshSegs();
  });
  DB.ref('segments').on('child_removed', snap => {
    remEndpts(snap.key); delete segs[snap.key];
    segKeys = segKeys.filter(k=>k!==snap.key);
    if (selKey===snap.key) { clearHdls(); selKey=null; mode='idle'; syncUI(); }
    renumber(); refreshSegs();
  });
}
</script>
</body>


<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b3b66">
<meta name="description" content="Available LeuvenFlyers shifts, pickup directions and pay information.">
<title>Available shifts · LeuvenFlyers</title>
<link rel="icon" type="image/png" href="https://res.cloudinary.com/de3kzkvhd/image/upload/v1749533761/4HirECt_srdsx7.png">
<style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:12px;font-synthesis:none;color:#193148;background:#edf2f6;--navy:#0b3b66;--teal:#008478;--line:#d5e1e9}
*{box-sizing:border-box}body{margin:0;font-size:12px;line-height:1.4}button,a{-webkit-tap-highlight-color:transparent}button{font:inherit}[hidden]{display:none!important}
.app-header{background:#fff;border-bottom:2px solid var(--navy)}.header-inner{max-width:480px;margin:auto;padding:8px 10px;display:flex;align-items:center;justify-content:space-between;gap:8px}.brand{display:flex;align-items:center;gap:7px;min-width:0}.brand img{width:30px;height:30px;object-fit:contain;flex:none}.brand strong{display:block;color:var(--navy);font-size:12px;font-weight:800}.brand span{display:block;color:#526c81;font-size:10px;font-weight:600;margin-top:1px}.header-label{font-size:9px;font-weight:800;letter-spacing:.05em;color:var(--teal);white-space:nowrap}
main{max-width:480px;margin:auto;padding:8px 8px 14px}.pay-banner{display:flex;align-items:center;justify-content:space-between;gap:8px;border-radius:6px;background:var(--navy);color:white;padding:8px 10px;margin-bottom:10px}.pay-banner>span{font-size:10px;font-weight:650}.pay-banner strong{font-size:12px;white-space:nowrap}.bonus{font-size:10px;font-weight:750;color:#b3f4e7;margin-left:5px}
.list-heading{display:flex;align-items:center;justify-content:space-between;gap:8px}.list-heading h1{font-size:12px;font-weight:800;margin:0;display:flex;gap:6px;align-items:center;color:var(--navy)}.count{background:#dce7ee;color:var(--navy);font-size:10px;border-radius:4px;min-width:19px;text-align:center;padding:1px 5px}.sync-state{font-size:9px;color:#4d677b;text-align:right}.list-note{font-size:10px;line-height:1.4;margin:4px 0 8px;color:#516b7e}
.shift-list{display:grid;grid-template-columns:minmax(0,1fr);gap:7px;align-items:start}.shift-card{background:#fff;border:1px solid var(--line);border-radius:7px;overflow:hidden;min-width:0}.card-main{padding:9px 10px 8px}.card-topline{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:5px}.campaign-id{font-size:9px;font-weight:750;color:#526e84;overflow-wrap:anywhere}.flyer-quantity{font-size:10px;color:#00675e;background:#e4f6f0;border-radius:4px;padding:3px 6px;font-weight:800;text-align:right;flex:none}.campaign-location{font-size:12px;font-weight:800;line-height:1.4;margin:0 0 6px;overflow-wrap:anywhere;color:var(--navy)}
.pickup{display:flex;align-items:flex-start;gap:6px;padding-top:6px;border-top:1px solid #e6edf2}.pickup svg{width:14px;height:14px;color:var(--teal);flex:none;margin-top:1px}.pickup>div{min-width:0}.pickup-label{font-size:9px;font-weight:750;color:#536c80;letter-spacing:.025em;display:block;margin-bottom:1px}.pickup-address{font-size:11px;font-weight:650;line-height:1.4;margin:0;color:#243e54;overflow-wrap:anywhere}
.card-footer{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 8px 0 10px;background:#f5f9fb;border-top:1px solid #e0e9f0;min-height:46px}.card-pay{min-width:0;font-size:9px;color:#4c667a;line-height:1.4}.card-pay>span{display:block;font-weight:600}.card-pay strong{font-size:12px;color:var(--navy);font-weight:800}.card-pay strong span{color:var(--teal);font-size:10px;font-weight:750;margin-left:4px}
.maps-link{display:flex;align-items:center;justify-content:center;gap:5px;min-height:44px;padding:8px 4px;color:var(--navy);text-decoration:none;font-weight:800;font-size:10px;text-align:right;flex:none}.maps-link:hover{color:var(--teal)}.maps-link svg{height:13px;width:13px;flex:none}.maps-unavailable{font-size:10px;line-height:1.4;color:#70551f;margin:0;max-width:140px;text-align:right}
.loading-state,.empty-state{grid-column:1/-1;text-align:center;background:#fff;border:1px solid var(--line);padding:20px 12px;border-radius:7px;color:#506c80;font-size:11px;line-height:1.5}.loading-state{display:flex;justify-content:center;align-items:center;gap:8px}.empty-state h3{color:var(--navy);font-size:12px;margin:0 0 4px}.empty-state p{margin:0;font-size:11px}.spinner{width:14px;height:14px;border:2px solid #dbe7ed;border-top-color:var(--teal);border-radius:50%;animation:spin .8s linear infinite;flex:none}@keyframes spin{to{transform:rotate(360deg)}}
.notice{padding:8px 10px;background:#fff5dd;border:1px solid #e8d49c;border-radius:6px;font-size:11px;line-height:1.5;color:#70551f;margin:0 0 8px}.retry{display:block;margin:10px auto 0;border:0;background:var(--navy);color:#fff;min-height:44px;border-radius:6px;padding:8px 18px;font-size:11px;font-weight:750;cursor:pointer}footer{max-width:480px;margin:auto;border-top:1px solid var(--line);font-size:9px;color:#526c80;text-align:center;padding:10px 8px max(10px,env(safe-area-inset-bottom))}footer span{margin:0 6px;color:#849aad}a:focus-visible,button:focus-visible{outline:2px solid var(--teal);outline-offset:1px}@media(max-width:300px){.header-label{display:none}.card-footer{flex-wrap:wrap;gap:0}.maps-link{justify-content:flex-start}.pay-banner{flex-wrap:wrap}.flyer-quantity{flex-shrink:1}.card-topline{align-items:flex-start}}@media(prefers-reduced-motion:reduce){.spinner{animation:none}}
</style>
</head>
<body>
<header class="app-header"><div class="header-inner"><div class="brand"><img src="https://res.cloudinary.com/de3kzkvhd/image/upload/v1749533761/4HirECt_srdsx7.png" alt="" width="30" height="30"><div><strong>LeuvenFlyers</strong><span>Distributor app</span></div></div><span class="header-label">SHIFT BOARD</span></div></header>
<main>
<section class="pay-banner" aria-label="Shift salary"><span>Basic salary per shift</span><strong>€36 <span class="bonus">+ bonus</span></strong></section>
<div class="list-heading"><h1>Available shifts <span id="shift-count" class="count" aria-label="Available shift count">—</span></h1><span id="sync-state" class="sync-state">Connecting…</span></div>
<p class="list-note">Shifts leave this list once pickup is confirmed.</p>
<div id="notice" class="notice" role="status" hidden></div>
<section id="shift-list" class="shift-list" aria-label="Available announced shifts" aria-busy="true"><div class="loading-state" role="status"><span class="spinner" aria-hidden="true"></span>Loading available shifts…</div></section>
<button id="retry" class="retry" hidden>Try again</button>
<noscript><div class="notice">Enable JavaScript to view available shifts.</div></noscript>
</main>
<footer>LeuvenFlyers <span aria-hidden="true">/</span> Distribution team</footer>
<script type="module">
const BASIC_SALARY=36;
function shiftNumber(shift,index=0){const saved=Number(shift?.shiftNumber),title=String(shift?.title||'').match(/(\d+)/);return saved>0?saved:(Number(title?.[1])||index+1)}
function orderedShifts(planner){return Object.entries(planner?.shifts||{}).filter(([,s])=>s&&typeof s==='object').map(([key,s])=>({...s,key})).sort((a,b)=>shiftNumber(a)-shiftNumber(b)||a.key.localeCompare(b.key))}
function pickupIds(campaignId,shifts){const suffix=campaignId.replace(/^XX/i,'');return [...new Set([`PUS${suffix}`,...shifts.map((s,i)=>s.pickupPosterId||(/^PUS/i.test(s.posterId||'')?s.posterId:`PUS${shiftNumber(s,i)}${suffix}`))])].filter(id=>/^[A-Za-z0-9_-]+$/.test(id))}
function countPickupPosts(value){return Object.values(value||{}).filter(p=>{if(!p||typeof p!=='object')return false;const lat=p.lat??p.latitude??p.location?.lat,lng=p.lng??p.longitude??p.location?.lng;return lat!==undefined&&lat!==null&&String(lat).trim()!==''&&lng!==undefined&&lng!==null&&String(lng).trim()!==''&&Number.isFinite(Number(lat))&&Number.isFinite(Number(lng))&&Math.abs(Number(lat))<=90&&Math.abs(Number(lng))<=180}).length}
function isAnnounced(summary){return !!summary&&(!summary.status||String(summary.status).toLowerCase()==='announced')}
function confirmedPickup(shift){return ['done','confirmed','picked_up','picked up','completed'].includes(String(shift.pickupStatus||'').trim().toLowerCase())||shift.pickupConfirmed===true}
function availableShifts(campaignId,summary,planner,pickupCount){
 if(!isAnnounced(summary)||!planner||['cancelled','canceled','completed','draft','planning'].includes(String(planner.meta?.status||'').toLowerCase()))return [];
 return orderedShifts(planner).map((s,index)=>({s,index})).filter(({s,index})=>index<pickupCount?false:!confirmedPickup(s)&&!['cancelled','canceled','completed','done'].includes(String(s.status||'').toLowerCase())).map(({s,index})=>({key:`${campaignId}/${s.key}`,campaignId,shiftKey:s.key,title:s.title||`Shift ${shiftNumber(s,index)}`,flyers:Math.max(0,Number(s.flyers)||0),pickupAddress:String(s.pickupAddress||planner.pickup?.address||summary.pickupAddress||'').trim(),location:String(planner.area?.name||summary.areaName||planner.meta?.areaName||'Location not provided'),salary:BASIC_SALARY}));
}
const mapsUrl=address=>`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(address)}`;
const escapeHtml=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const esc=escapeHtml;
import {initializeApp} from 'https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js';
import {getDatabase,ref,onValue} from 'https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js';
const app=initializeApp({
apiKey:'AIzaSyD_c9jMxAA6dtyk_EXAHnH09OEAoalUADA',
authDomain:'trackingclients.firebaseapp.com',
projectId:'trackingclients',
storageBucket:'trackingclients.appspot.com',
messagingSenderId:'27490943622',
appId:'1:27490943622:web:d6c87547aa5df440508707',
databaseURL:'https://trackingclients-default-rtdb.firebaseio.com/'
});
const db=getDatabase(app);
const dotsApp=initializeApp({
apiKey:'AIzaSyA6w6auszWRniQfZCjb4nXE_bq9Mzt9dOs',
authDomain:'betbtc-6d881.firebaseapp.com',
databaseURL:'https://betbtc-6d881-default-rtdb.firebaseio.com',
projectId:'betbtc-6d881',
storageBucket:'betbtc-6d881.firebasestorage.app',
messagingSenderId:'962176232122',
appId:'1:962176232122:web:a277d922543c3378033083'
},'dotsApp');
const dotsDb=getDatabase(dotsApp);
const $=id=>document.getElementById(id),campaigns=new Map();
let rootOff=null,connectionOff=[],rootReady=false,rootError='',generation=0,connectionState={tracking:false,dots:false},connectionObserved=false;
const pin='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M20 10c0 6-8 11-8 11S4 16 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/></svg>';
const external='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M14 3h7v7M21 3 10 14M10 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-5"/></svg>';
function card(shift){return `<article class="shift-card"><div class="card-main"><div class="card-topline"><span class="campaign-id">${esc(shift.campaignId)} · ${esc(shift.title)}</span><span class="flyer-quantity">${shift.flyers.toLocaleString()} flyers</span></div><h3 class="campaign-location">${esc(shift.location)}</h3><div class="pickup">${pin}<div><span class="pickup-label">PICKUP ADDRESS</span><p class="pickup-address">${esc(shift.pickupAddress||'Pickup address not yet provided')}</p></div></div></div><div class="card-footer"><div class="card-pay"><span>Basic salary</span><strong>€36 <span>+ bonus</span></strong></div>${shift.pickupAddress?`<a class="maps-link" href="${esc(mapsUrl(shift.pickupAddress))}" target="_blank" rel="noopener noreferrer" aria-label="View pickup for ${esc(shift.campaignId)} ${esc(shift.title)} on Google Maps">View on Google Maps ${external}</a>`:'<p class="maps-unavailable">Pickup address pending</p>'}</div></article>`}
function dispose(state){state.closed=true;state.planOff?.();state.pickupOff.forEach(off=>off());state.pickupOff=[]}
function render(){
 const connected=connectionState.tracking&&connectionState.dots,offline=connectionObserved&&!connected;
 const states=[...campaigns.values()],pending=states.filter(s=>!s.error&&(!s.plannerReady||s.pending.size)),failed=states.filter(s=>s.error||s.pickupErrors.size);
 const visible=(!rootReady||rootError||offline)?[]:states.filter(s=>s.plannerReady&&!s.error&&!s.pending.size&&!s.pickupErrors.size).flatMap(s=>availableShifts(s.id,s.summary,s.planner,[...s.pickupCounts.values()].reduce((n,c)=>n+c,0))).sort((a,b)=>a.location.localeCompare(b.location)||a.campaignId.localeCompare(b.campaignId)||a.title.localeCompare(b.title,undefined,{numeric:true}));
 $('shift-count').textContent=rootReady&&!rootError&&!offline?String(visible.length):'—';
 $('sync-state').textContent=rootError?'Unavailable':offline?'Reconnecting…':!rootReady||pending.length?'Updating…':'Up to date';
 const warning=rootError|| (offline?'Connection interrupted. Reconnecting to check shift availability.':failed.length?'Some campaigns could not be checked. Their shifts are hidden until availability can be confirmed.':'');
 $('notice').textContent=warning;$('notice').hidden=!warning;$('retry').hidden=!(rootError||failed.length||offline);
 $('shift-list').setAttribute('aria-busy',String(!rootReady||pending.length>0||offline));
 if(visible.length){$('shift-list').innerHTML=visible.map(card).join('');return}
 if(rootError||failed.length&&!pending.length){$('shift-list').innerHTML='<div class="empty-state"><h3>Availability is temporarily unavailable</h3><p>Please try again in a moment.</p></div>';return}
 if(!rootReady||pending.length||offline){$('shift-list').innerHTML='<div class="loading-state" role="status"><span class="spinner" aria-hidden="true"></span>Checking available shifts…</div>';return}
 $('shift-list').innerHTML='<div class="empty-state"><h3>No open shifts right now</h3><p>Newly announced shifts will appear here automatically.</p></div>';
}
function watchPickups(state){
 const ids=pickupIds(state.id,orderedShifts(state.planner)),signature=JSON.stringify(ids);if(signature===state.signature)return;
 state.signature=signature;state.pickupGeneration++;const run=state.pickupGeneration;
 state.pickupOff.forEach(off=>off());state.pickupOff=[];state.pickupCounts.clear();state.pickupErrors.clear();state.pending=new Set(ids);
 ids.forEach(id=>{const off=onValue(ref(dotsDb,`userPosts/${id}`),snapshot=>{if(state.closed||run!==state.pickupGeneration)return;state.pickupCounts.set(id,countPickupPosts(snapshot.val()));state.pending.delete(id);state.pickupErrors.delete(id);render()},error=>{if(state.closed||run!==state.pickupGeneration)return;console.warn('Pickup availability could not be read',error);state.pending.delete(id);state.pickupErrors.add(id);render()});state.pickupOff.push(off)});
}
function watchCampaign(id,summary){
 const state={id,summary,planner:null,plannerReady:false,error:false,pickupCounts:new Map(),pickupErrors:new Set(),pending:new Set(),pickupOff:[],pickupGeneration:0,signature:'',closed:false};campaigns.set(id,state);
 state.planOff=onValue(ref(db,`campaigns/${id}/planner`),snapshot=>{if(state.closed)return;state.planner=snapshot.val();state.plannerReady=true;state.error=false;watchPickups(state);render()},error=>{if(state.closed)return;console.warn('Campaign availability could not be read',error);state.error=true;render()});
}
function connect(){
 const run=++generation;rootOff?.();connectionOff.forEach(off=>off());connectionOff=[];campaigns.forEach(dispose);campaigns.clear();rootReady=false;rootError='';connectionObserved=false;connectionState={tracking:false,dots:false};render();
 for(const [name,database] of [['tracking',db],['dots',dotsDb]])connectionOff.push(onValue(ref(database,'.info/connected'),snapshot=>{if(run!==generation)return;connectionState[name]=snapshot.val()===true;if(connectionState.tracking&&connectionState.dots)connectionObserved=true;render()}));
 rootOff=onValue(ref(db,'announcedCampaigns'),snapshot=>{if(run!==generation)return;rootReady=true;rootError='';const entries=Object.entries(snapshot.val()||{}).filter(([id,summary])=>/^XX\d+$/i.test(id)&&isAnnounced(summary)),ids=new Set(entries.map(([id])=>id));
 campaigns.forEach((state,id)=>{if(!ids.has(id)){dispose(state);campaigns.delete(id)}});
 entries.forEach(([id,summary])=>{const state=campaigns.get(id);if(state)state.summary=summary;else watchCampaign(id,summary)});render();
 },error=>{if(run!==generation)return;console.warn('Announced shifts could not be read',error);rootError='Could not load announced shifts. Please check your connection and try again.';render()});
}
$('retry').addEventListener('click',connect);
window.addEventListener('offline',()=>{connectionObserved=true;connectionState.tracking=false;connectionState.dots=false;render()});
window.addEventListener('pagehide',()=>{generation++;rootOff?.();connectionOff.forEach(off=>off());campaigns.forEach(dispose)});
window.addEventListener('pageshow',event=>{if(event.persisted)connect()});
connect();
setTimeout(()=>{if(!rootReady){$('notice').textContent='Still connecting. Check your connection or try again.';$('notice').hidden=false;$('retry').hidden=false}},15000);

</script>
</body></html>

  function muniRings(geo){
    if(!geo) return [];
    if(geo.type==='Polygon')      return [geo.coordinates[0]];
    if(geo.type==='MultiPolygon') return geo.coordinates.map(p=>p[0]);
    if(geo.type==='GeometryCollection' && Array.isArray(geo.geometries)){
      let out=[];
      geo.geometries.forEach(g=>{ out = out.concat(muniRings(g)); });
      return out;
    }
    return [];
  }
  function simplifyRing(ring, MAX=120){
    let pts = ring.slice();
    if(pts.length>1 && pts[0][0]===pts[pts.length-1][0] && pts[0][1]===pts[pts.length-1][1]) pts=pts.slice(0,-1);
    if(pts.length<=MAX) return pts;
    const step = pts.length/MAX, out=[];
    for(let i=0;i<MAX;i++) out.push(pts[Math.floor(i*step)]);
    return out;
  }

  async function saveMunicipality(name){
    const m = muniByName.get(name);
    if(!m) return;
    try {
      const rings = muniRings(m.geometry);
      if(!rings.length){ toast('No usable geometry'); return; }
      const keys=[];
      for(const ring of rings){
        const simp = simplifyRing(ring);
        if(simp.length<3) continue;
        const payload = { _name:name };
        // Storage: round boundary points to 5 decimals (\\~1 m) before saving —
        // Opendatasoft coords carry 13+ decimals, roughly double the bytes.
        simp.forEach(([lng,lat],i)=>{ payload[i]={lat:roundCoord(lat),lng:roundCoord(lng)}; });
        const r = await push(ref(polygonsDb, FB_MUNI), payload);
        keys.push(r.key);
      }
      if(!keys.length){ toast('Boundary too small'); return; }
      m.savedKey = keys[0]; m.savedExtraKeys = keys.slice(1);
      toast('Saved '+name+(keys.length>1?` (${keys.length} parts)`:''));
      renderMunicipalities();
    } catch(err){
      console.error('saveMunicipality error:', err);
      toast('Save failed: ' + (err.code || err.message || 'unknown'));
    }
  }

  async function deleteMunicipality(name){
    const m = muniByName.get(name);
    if(!m) return;
    try {
      const snap = await get(ref(polygonsDb, FB_MUNI));
      const dels = [];
      if(snap.exists()){
        snap.forEach(ch=>{ if((ch.val()||{})._name===name) dels.push(remove(ref(polygonsDb, FB_MUNI+'/'+ch.key))); });
      }
      await Promise.all(dels);
      m.savedKey=null; m.savedExtraKeys=[];
      toast('Deleted '+name);
      renderMunicipalities();
    } catch(err){ console.error(err); toast('Delete failed'); }
  }

  async function deleteSubZone(zoneNumber){
    const idx = polygonsByZone.get(zoneNumber);
    if(idx===undefined){ toast('Sub-zone not found'); return; }
    const meta = polygonMeta[idx];
    const key = meta && meta.firebaseKey;
    if(!key){ toast('Cannot delete this sub-zone'); return; }
    try {
      await remove(ref(polygonsDb, (meta.sourcePath||FB_SUBZONES)+'/'+key));
      const statusKey = zoneStatusKeyByZone.get(zoneNumber);
      if(statusKey){ try { await remove(ref(db, ZONE_STATUS_PATH+'/'+statusKey)); } catch(e){} }
      toast('Sub-zone '+((meta&&meta.displayName)||zoneNumber)+' deleted');
      if(activePopup){ activePopup.remove(); activePopup=null; }
      await loadSubZones();
      updateZonesVisual();
    } catch(err){ console.error('deleteSubZone error:', err); toast('Delete failed'); }
  }

  /* ════════════════════════════════════════════════════════════════════
     SEARCH — municipality locally, address via Nominatim on submit only
     Public Nominatim usage rules: no autocomplete / bulk queries; keep under
     1 request per second and show OpenStreetMap attribution. For high-traffic
     production use, point GEOCODER_URL at your own or a commercial geocoder.
     ════════════════════════════════════════════════════════════════════ */
  function normalizeSearchText(v){
    return String(v||'').trim().toLocaleLowerCase('nl-BE')
      .normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ');
  }

  function localMunicipalityMatches(query, max=6){
    const q=normalizeSearchText(query);
    if(!q) return [];
    const ranked=[];
    muniByName.forEach(m=>{
      const n=normalizeSearchText(m.name);
      let score=99;
      if(n===q) score=0;
      else if(n.startsWith(q)) score=1;
      else if(n.includes(q)) score=2;
      if(score<99) ranked.push({m,score});
    });
    ranked.sort((a,b)=>a.score-b.score || a.m.name.localeCompare(b.m.name,'nl-BE'));
    return ranked.slice(0,max).map(x=>x.m);
  }

  function clearSearchResults(){
    searchResultsEl.classList.remove('visible');
    searchResultsEl.innerHTML='';
  }

  function clearSearchVisual(){
    try{ if(map?.getSource('search-highlight-src')) map.getSource('search-highlight-src').setData(fc()); }catch(e){}
    if(searchMarker){ searchMarker.remove(); searchMarker=null; }
  }

  function showSearchState(text){
    searchResultsEl.innerHTML=`<div class="search-state">${escapeHtml(text)}</div>`;
    searchResultsEl.classList.add('visible');
  }

  function escapeHtml(v){
    return String(v??'').replace(/[&<>'"]/g,c=>({
      '&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'
    })[c]);
  }

  function focusMunicipality(m){
    if(!m || !map) return;
    clearSearchVisual();
    try{
      const f={type:'Feature',properties:{name:m.name},geometry:m.geometry};
      const b=turf.bbox(f);
      if(map.getSource('search-highlight-src')) map.getSource('search-highlight-src').setData(fc([f]));
      map.fitBounds([[b[0],b[1]],[b[2],b[3]]],{padding:55,maxZoom:13,duration:750});
      const c=turf.centroid(f).geometry.coordinates;
      setTimeout(()=>showMuniPopup(m.name,{lng:c[0],lat:c[1]}),420);
    }catch(e){
      console.warn('Municipality focus failed',e);
      toast('Could not focus municipality');
    }
    mapSearchInput.value=m.name;
    clearSearchResults();
  }

  function geocodeCacheGet(query){
    try{
      const raw=localStorage.getItem(GEOCODER_CACHE_PREFIX+normalizeSearchText(query));
      if(!raw) return null;
      const obj=JSON.parse(raw);
      if(!obj || !Array.isArray(obj.data) || Date.now()-obj.ts>GEOCODER_CACHE_TTL_MS){
        localStorage.removeItem(GEOCODER_CACHE_PREFIX+normalizeSearchText(query));
        return null;
      }
      return obj.data;
    }catch(e){ return null; }
  }

  function geocodeCacheSet(query,data){
    try{
      localStorage.setItem(GEOCODER_CACHE_PREFIX+normalizeSearchText(query),JSON.stringify({ts:Date.now(),data}));
    }catch(e){}
  }

  async function geocodeBelgium(query){
    const cached=geocodeCacheGet(query);
    if(cached) return cached;
    const since=Date.now()-lastGeocodeRequestAt;
    if(since<GEOCODER_MIN_INTERVAL_MS) await new Promise(r=>setTimeout(r,GEOCODER_MIN_INTERVAL_MS-since));
    const u=new URL(GEOCODER_URL);
    u.searchParams.set('q',query);
    u.searchParams.set('format','jsonv2');
    u.searchParams.set('countrycodes','be');
    u.searchParams.set('layer','address');
    u.searchParams.set('addressdetails','1');
    u.searchParams.set('limit','5');
    lastGeocodeRequestAt=Date.now();
    const r=await fetch(u.toString(),{mode:'cors',headers:{'Accept':'application/json'}});
    if(!r.ok) throw new Error('Geocoder HTTP '+r.status);
    const data=await r.json();
    const rows=Array.isArray(data)?data:[];
    geocodeCacheSet(query,rows);
    return rows;
  }

  function focusAddressResult(r){
    if(!r || !map) return;
    clearSearchVisual();
    const lat=Number(r.lat),lng=Number(r.lon);
    if(!Number.isFinite(lat)||!Number.isFinite(lng)) return;
    const pin=document.createElement('div'); pin.className='search-pin';
    searchMarker=new maplibregl.Marker({element:pin,anchor:'bottom'}).setLngLat([lng,lat]).addTo(map);
    const bb=Array.isArray(r.boundingbox)?r.boundingbox.map(Number):null;
    if(bb && bb.length===4 && bb.every(Number.isFinite)){
      map.fitBounds([[bb[2],bb[0]],[bb[3],bb[1]]],{padding:70,maxZoom:17,duration:750});
    }else{
      map.flyTo({center:[lng,lat],zoom:16,duration:750});
    }
    if(activePopup){activePopup.remove();activePopup=null;}
    const label=escapeHtml(r.display_name||'Search result');
    activePopup=new maplibregl.Popup({closeButton:true,closeOnClick:false,offset:[0,-22],maxWidth:'310px'})
      .setLngLat([lng,lat])
      .setHTML(`<div style="text-align:left"><div class="pp-title zone"><span class="material-icons-outlined">place</span>Address</div><div class="pp-note">${label}</div><div class="pp-note" style="margin-top:7px">Search data © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap contributors</a></div></div>`)
      .addTo(map);
    mapSearchInput.value=r.display_name||mapSearchInput.value;
    clearSearchResults();
  }

  function renderSearchResults(munis,addresses){
    searchResultsEl.innerHTML='';
    const frag=document.createDocumentFragment();
    munis.forEach(m=>{
      const b=document.createElement('button');
      b.type='button'; b.className='search-result muni-result'; b.setAttribute('role','option');
      b.innerHTML=`<span class="material-icons-outlined">location_city</span><span class="search-result-main"><span class="search-result-title">${escapeHtml(m.name)}</span><span class="search-result-sub">Municipality</span></span>`;
      b.addEventListener('click',()=>focusMunicipality(m)); frag.appendChild(b);
    });
    addresses.forEach(r=>{
      const b=document.createElement('button');
      b.type='button'; b.className='search-result'; b.setAttribute('role','option');
      const a=r.address||{};
      const title=a.road ? ((a.house_number?escapeHtml(a.house_number)+' ':'')+escapeHtml(a.road)) : escapeHtml(r.name||String(r.display_name||'').split(',')[0]||'Address');
      b.innerHTML=`<span class="material-icons-outlined">place</span><span class="search-result-main"><span class="search-result-title">${title}</span><span class="search-result-sub">${escapeHtml(r.display_name||'')}</span></span>`;
      b.addEventListener('click',()=>focusAddressResult(r)); frag.appendChild(b);
    });
    if(!munis.length && !addresses.length){
      const d=document.createElement('div'); d.className='search-state'; d.textContent='No Belgian municipality or address found.'; frag.appendChild(d);
    }
    if(addresses.length){
      const att=document.createElement('div'); att.className='search-attribution';
      att.innerHTML='Address search © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap contributors</a>';
      frag.appendChild(att);
    }
    searchResultsEl.appendChild(frag);
    searchResultsEl.classList.add('visible');
  }

  async function runMapSearch(){
    const q=(mapSearchInput.value||'').trim();
    if(!q){ clearSearchResults(); return; }
    mapSearchBtn.disabled=true;
    try{
      if(!muniLoaded) await loadMunicipalities();
      const munis=localMunicipalityMatches(q,6);
      const nq=normalizeSearchText(q);
      const exact=munis.find(m=>normalizeSearchText(m.name)===nq);
      if(exact){ focusMunicipality(exact); return; }
      // A short partial municipality query is handled locally and never sent out.
      if(munis.length && q.length<8){ renderSearchResults(munis,[]); return; }
      showSearchState('Searching Belgium…');
      let addresses=[];
      try{ addresses=await geocodeBelgium(q); }
      catch(e){ console.warn('Address search failed',e); }
      renderSearchResults(munis,addresses);
    }finally{ mapSearchBtn.disabled=false; }
  }

  mapSearchBtn.addEventListener('click',runMapSearch);
  mapSearchInput.addEventListener('keydown',e=>{
    if(e.key==='Enter'){e.preventDefault();runMapSearch();}
    else if(e.key==='Escape'){clearSearchResults();mapSearchInput.blur();}
  });
  document.addEventListener('click',e=>{ if(!searchWrap.contains(e.target)) clearSearchResults(); });

  /* ════════════════════════════════════════════════════════════════════
     DRAWING SUB-ZONES (bookable, saved to belgisubzones)
     ════════════════════════════════════════════════════════════════════ */
  // Drawing is allowed ANYWHERE on the map — no municipality is required and
  // nothing is ever blocked or clipped. If the zone happens to start inside a
  // municipality, its name is remembered only for the campaign-area filter.
  function startDraw(parentMuniName=null){
    drawing = true; drawPts = []; drawParentMuni = parentMuniName;
    if(map.doubleClickZoom) map.doubleClickZoom.disable();
    document.body.classList.add('drawing');
    syncToolbar();
    drawHint.classList.add('visible');
    dhText.textContent = 'Draw anywhere on the map · tap to add points · double-click or Finish to close';
    map.getSource('draw-src').setData(fc());
    if(activePopup){ activePopup.remove(); activePopup=null; }
  }

  function cancelDraw(){
    drawing=false; drawPts=[]; drawParentMuni=null;
    if(map.doubleClickZoom) map.doubleClickZoom.enable();
    document.body.classList.remove('drawing');
    syncToolbar();
    drawHint.classList.remove('visible');
    if(map.getSource('draw-src')) map.getSource('draw-src').setData(fc());
  }

  function handleDrawClick(e){
    const lng=e.lngLat.lng, lat=e.lngLat.lat;
    // Free drawing: only tag the parent municipality (if any) for the
    // campaign-area filter — never restrict where points can go.
    if(drawPts.length===0 && !drawParentMuni){
      const hit = muniAtPoint(lng,lat);
      if(hit) drawParentMuni = hit;
    }
    drawPts.push([lng,lat]);
    renderDrawPreview(lng,lat);
  }

  function renderDrawPreview(mx,my){
    const f=[];
    drawPts.forEach(p=>f.push(feat('Point',p)));
    if(drawPts.length){
      const ln=[...drawPts,[mx,my]];
      f.push(feat('LineString',ln));
      if(drawPts.length>=2) f.push(feat('Polygon',[[...ln,drawPts[0]]]));
    }
    if(map.getSource('draw-src')) map.getSource('draw-src').setData(fc(f));
  }

  async function finishDraw(){
    if(drawPts.length<3){ toast('Need at least 3 points'); return; }
    const parent = drawParentMuni;
    const ringLngLat = [...drawPts, drawPts[0]];
    // Storage: round drawn points to 5 decimals (\\~1 m) before saving
    const coords = simplifyRing(ringLngLat, 200).map(([lng,lat])=>({lat:roundCoord(lat),lng:roundCoord(lng)}));
    if(coords.length<3){ toast('Sub-zone invalid'); cancelDraw(); return; }

    // Auto-number: max existing numeric sub-zone + 1
    let maxN=0;
    polygonsByZone.forEach((_,zn)=>{ const n=parseInt(zn,10); if(!isNaN(n)&&n>maxN) maxN=n; });
    const zoneName = String(maxN+1);

    const payload = { zoneName, _parent: parent || '' };
    coords.forEach((p,i)=>{ payload[i]=p; });
    try {
      await push(ref(polygonsDb, FB_SUBZONES), payload);
      toast('Sub-zone '+zoneName+' saved'+(parent?` in ${parent}`:''));
    } catch(err){ console.error(err); toast('Save failed'); }
    cancelDraw();
    await loadSubZones();
    updateZonesVisual();
  }

  function muniAtPoint(lng,lat){
    for(const [name,m] of muniByName){
      try {
        const g=m.geometry;
        const poly = g.type==='MultiPolygon'? turf.multiPolygon(g.coordinates): turf.polygon(g.coordinates);
        if(turf.booleanPointInPolygon([lng,lat], poly)) return name;
      } catch {}
    }
    return null;
  }

  /* ════════════════════════════════════════════════════════════════════
     SUB-ZONES load + render (bookable)
     ════════════════════════════════════════════════════════════════════ */
  function parseZoneCoords(raw){
    return Object.keys(raw)
      .filter(k=>!isNaN(Number(k)))
      .sort((a,b)=>Number(a)-Number(b))
      .map(k=>{ const pt=raw[k]; return Array.isArray(pt)?{lat:pt[0],lng:pt[1]}:{lat:pt&&pt.lat,lng:pt&&pt.lng}; })
      .filter(pt=>typeof pt.lat==='number'&&typeof pt.lng==='number');
  }

  function addZoneMeta(raw, firebaseKey, sourcePath, zoneName, displayName, collect){
    const coordsLatLng = parseZoneCoords(raw);
    if(coordsLatLng.length<3) return false;
    const ring = coordsLatLng.map(p=>[p.lng,p.lat]);
    if(ring[0][0]!==ring[ring.length-1][0]||ring[0][1]!==ring[ring.length-1][1]) ring.push(ring[0]);
    let turfPoly;
    try { turfPoly = turf.polygon([ring]); } catch(e){ return false; }
    let center;
    try { center = turf.centroid(turfPoly).geometry.coordinates; } catch(e){ return false; }
    const lngs=ring.map(r=>r[0]), lats=ring.map(r=>r[1]);
    const bounds={ minLng:Math.min(...lngs),maxLng:Math.max(...lngs),minLat:Math.min(...lats),maxLat:Math.max(...lats) };
    collect.lngs.push(...lngs); collect.lats.push(...lats);
    polygonMeta.push({ zoneNumber:zoneName, displayName:displayName||zoneName, turfPoly, bounds, firebaseKey, center, parent: raw._parent||'', sourcePath });
    polygonsByZone.set(zoneName, polygonMeta.length-1);
    return true;
  }

  async function loadSubZones(){
    labelMarkers.forEach(m=>m.remove()); labelMarkers.clear();
    polygonMeta = []; polygonsByZone.clear();
    const collect = { lngs:[], lats:[] };

    // 1) Drawn sub-zones (belgisubzones — shared, bookable)
    try {
      const snap = await get(ref(polygonsDb, FB_SUBZONES));
      if(snap.exists()){
        snap.forEach(child=>{
          const raw=child.val();
          if(!raw||typeof raw!=='object') return;
          let zoneName = raw.zoneName||raw.zoneNumber;
          if(zoneName===undefined||zoneName===null||String(zoneName).trim()==='') zoneName=String(polygonMeta.length+1);
          else zoneName=String(zoneName).trim();
          addZoneMeta(raw, child.key, FB_SUBZONES, zoneName, zoneName, collect);
        });
      }
    } catch(e){ console.warn('belgisubzones read failed', e); }

    // 2) Polygon-Saver zones ('polygons' path) — merged in, fully bookable
    if(includeSaverZones){
      try {
        const saverCollect = { lngs:[], lats:[] };
        const snap2 = await get(ref(polygonsDb, FB_SAVER));
        if(snap2.exists()){
          const entries=[];
          snap2.forEach(ch=>{ entries.push({ key:ch.key, raw:ch.val() }); });
          entries.sort((a,b)=> a.key<b.key ? -1 : 1);
          let n=0;
          entries.forEach(({key,raw})=>{
            if(!raw||typeof raw!=='object') return;
            if(addZoneMeta(raw, key, FB_SAVER, 'P_'+key, 'P'+(n+1), saverCollect)) n++;
          });
          console.log('[Saver] zones merged:', n);
        }
      } catch(e){ console.warn('polygons read failed', e); }
    }

    if(map.getSource('zones-fill-src')) map.getSource('zones-fill-src').setData(fc());
    updateZonesVisual();

    if(firstFullLoad && collect.lngs.length && !showAllZones){
      map.fitBounds([[Math.min(...collect.lngs),Math.min(...collect.lats)],[Math.max(...collect.lngs),Math.max(...collect.lats)]],{padding:50,duration:900});
    }
  }

  function addOrUpdateLabelMarker(zoneNumber, center, status, flyersCount, displayName){
    const existing = labelMarkers.get(zoneNumber);
    if(existing) existing.remove();
    const el = document.createElement('div');
    el.innerHTML = zoneLabelHtml(zoneNumber, status, flyersCount, displayName);
    el.style.pointerEvents='all'; el.style.cursor='pointer';
    el.addEventListener('click', ()=>{ if(!drawing) showZonePopup(zoneNumber,{lng:center[0],lat:center[1]}); });
    const m = new maplibregl.Marker({ element:el, anchor:'center' }).setLngLat(center).addTo(map);
    labelMarkers.set(zoneNumber, m);
  }

  function zoneLabelHtml(z, status='', flyersCount=0, display=null){
    const classes=['zone-label'];
    if(status==='booked') classes.push('status-booked');
    if(status==='completed') classes.push('status-completed');
    const flyersHtml = status==='completed'&&flyersCount>0
      ? `<span class="flyers-badge"><span class="material-icons-outlined">mail</span>${flyersCount}</span>`:'';
    const yesCount = yesDotsCountByZone.get(z)||0;
    const noCount = noDotsCountByZone.get(z)||0;
    const totalCount = totalDotsCountByZone.get(z)||(yesCount+noCount);
    const dotsHtml = totalCount>0
      ? `<span class="dots-badge yes" title="YES / delivered">${yesCount}</span>` +
        `<span class="dots-badge no" title="NO">${noCount}</span>` +
        `<span class="dots-badge total" title="Total clicks">${totalCount}</span>`
      : '';
    return `<div class="${classes.join(' ')}"><span class="zone-num">${display||z}</span>${flyersHtml}${dotsHtml}</div>`;
  }

  function listenZoneStatuses(){
    onValue(ref(db, ZONE_STATUS_PATH), snap => {
      const newlyCompleted=[]; const existingCompleted=new Set();
      zoneStatusByZone.forEach((s,z)=>{ if(s.status==='completed') existingCompleted.add(z); });
      zoneStatusByZone.clear(); zoneStatusKeyByZone.clear();
      if(snap.exists()){
        snap.forEach(child=>{
          const key=child.key; const data=child.val()||{};
          const fieldZone = data.zoneName||String(data.zoneNumber||'');
          const keyNum = safeInt(key);
          let zName=null;
          if(fieldZone && polygonsByZone.has(fieldZone)) zName=fieldZone;
          else if(keyNum && polygonsByZone.has(String(keyNum))) zName=String(keyNum);
          else if((keyNum||key==='0') && polygonsByZone.has(String(keyNum+1))) zName=String(keyNum+1);
          else if(safeInt(data.zone)&&polygonsByZone.has(String(safeInt(data.zone)))) zName=String(safeInt(data.zone));
          if(zName!=null){
            if(data.status==='completed'&&!existingCompleted.has(zName)){
              data.completedAt=data.completedAt||Date.now();
              newlyCompleted.push({zoneNum:zName,timestamp:data.completedAt});
            }
            zoneStatusByZone.set(zName,data);
            zoneStatusKeyByZone.set(zName,key);
          }
        });
      }
      idle(updateZonesVisual);
      if(firstFullLoad){
        firstFullLoad=false;
        const last=newlyCompleted.sort((a,b)=>b.timestamp-a.timestamp)[0];
        if(last) setTimeout(()=>focusZone(last.zoneNum),250);
      } else if(newlyCompleted.length){
        const last=newlyCompleted.sort((a,b)=>b.timestamp-a.timestamp)[0];
        if(last) focusZone(last.zoneNum);
      }
      firstLoad.statuses.resolve();
    });
  }

  function subzoneInSavedArea(meta){
    if(!meta) return false;
    if(meta.parent && muniByName.has(meta.parent) && muniByName.get(meta.parent).savedKey) return true;
    try {
      const c = meta.center;
      for(const [,m] of muniByName){
        if(!m.savedKey) continue;
        const g=m.geometry;
        const poly = g.type==='MultiPolygon' ? turf.multiPolygon(g.coordinates) : turf.polygon(g.coordinates);
        if(turf.booleanPointInPolygon(c, poly)) return true;
      }
    } catch(e){}
    return false;
  }

  function updateZonesVisual(){
    const fillFeatures=[];
    polygonMeta.forEach((metaObj)=>{
      const {zoneNumber, turfPoly, center}=metaObj;
      const z=zoneStatusByZone.get(zoneNumber)||{};
      const dotCount=dotsCountByZone.get(zoneNumber)||0;
      const hasBlueDots=dotCount>0;
      const isBooked=z.status==='booked';
      const isCompleted=z.status==='completed';
      const isRelevant=isBooked||isCompleted||hasBlueDots;

      // Campaign-area mode → zones in the saved area PLUS anything booked /
      // completed / live. All other modes → everything visible.
      let visible;
      if(showCampaignArea) visible = isRelevant || subzoneInSavedArea(metaObj);
      else                 visible = true;

      if(!visible){
        const existing=labelMarkers.get(zoneNumber);
        if(existing){ existing.remove(); labelMarkers.delete(zoneNumber); }
        return;
      }

      let fillColor, lineColor;
      if(hasBlueDots||isCompleted){ fillColor='#2e7d32'; lineColor='#1b5e20'; }
      else if(isBooked){ fillColor='#F5C33B'; lineColor='#b38700'; }
      else { fillColor='#60a5fa'; lineColor='#2563eb'; }   // available (blue)

      const ring=turfPoly.geometry.coordinates[0];
      fillFeatures.push(feat('Polygon',[ring],{
        zoneNumber, fillColor, fillOpacity:isRelevant?0.34:0.2, lineColor
      }));
      addOrUpdateLabelMarker(zoneNumber, center, z.status||'', safeInt(z.flyers), metaObj.displayName);
    });
    if(map.getSource('zones-fill-src')) map.getSource('zones-fill-src').setData(fc(fillFeatures));
    recalcFlyersRequired();
  }

  function recalcFlyersRequired(){
    let total=0;
    zoneStatusByZone.forEach(z=>{ if(z.status==='booked'&&z.flyersRequired) total+=safeInt(z.flyersRequired); });
    flyersRequiredEl.textContent=total.toLocaleString();
  }

  /* ── Zone popup ── */
  function clearBuildingDots(){ if(map.getSource('building-dots-src')) map.getSource('building-dots-src').setData(fc()); }
  function showBuildingDots(centers){
    if(!map.getSource('building-dots-src')) return;
    map.getSource('building-dots-src').setData(fc(centers.map(([lat,lng])=>feat('Point',[lng,lat]))));
  }

  function showZonePopup(zoneNumber, lngLat, autoLoadBuildings=true){
    clearBuildingDots();
    if(activePopup){ activePopup.remove(); activePopup=null; }

    const z=zoneStatusByZone.get(zoneNumber)||{};
    const idxMeta=polygonsByZone.get(zoneNumber);
    const zoneMeta=idxMeta!==undefined?polygonMeta[idxMeta]:null;
    const displayName=(zoneMeta&&zoneMeta.displayName)||zoneNumber;
    const meta=statusMeta(z.status);
    const flyers=safeInt(z.flyers);
    const canBook = z.status!=='booked'&&z.status!=='completed';
    const canUnbook = z.status==='booked';

    let actionButtons='';
    if(canBook) actionButtons+=`<button class="zp-btn warn" data-act="book" data-zone="${zoneNumber}"><span class="material-icons-outlined">bookmark_add</span>Book</button>`;
    if(canUnbook) actionButtons+=`<button class="zp-btn danger" data-act="unbook" data-zone="${zoneNumber}"><span class="material-icons-outlined">bookmark_remove</span>Unbook</button>`;
    if(z.status==='completed'){
      if(z.verifiedAt) actionButtons+=`<button class="zp-btn" disabled><span class="material-icons-outlined">verified</span>Verified</button>`;
      else actionButtons+=`<button class="zp-btn verify-btn" data-act="verify" data-zone="${zoneNumber}"><span class="material-icons-outlined">check_circle</span>Verify</button>`;
    }
    actionButtons+=`<button class="zp-btn danger" data-act="del-subzone" data-zone="${zoneNumber}"><span class="material-icons-outlined">delete</span>Delete</button>`;

    const flyersReqHtml = z.flyersRequired
      ? `<div class="pp-row"><span class="material-icons-outlined" style="color:var(--warning);">group</span>Required: <strong>${z.flyersRequired.toLocaleString()}</strong></div>`:'';
    const proofImgHtml = z.proofImage
      ? `<div style="margin-top:10px;"><img src="${z.proofImage}" data-proof="${z.proofImage}" loading="lazy" style="max-width:110px;border-radius:8px;cursor:pointer;border:1px solid var(--ink-300);"></div>`:'';
    const gpsHtml = (z.gpsProof||z.gpsUrl)
      ? `<div style="margin-top:8px;"><a href="${z.gpsProof||z.gpsUrl}" target="_blank" rel="noopener" style="background:#1976d2;color:#fff;font-size:10px;padding:5px 12px;border-radius:10px;display:inline-flex;align-items:center;gap:6px;text-decoration:none;"><span class="material-icons-outlined" style="font-size:14px;">assistant_navigation</span>GPS Route</a></div>`:'';

    const buildingStatusId=`bld-status-${zoneNumber}`;
    const buildingHtml = autoLoadBuildings
      ? `<div id="${buildingStatusId}" class="pp-row"><span class="material-icons-outlined" style="animation:spin 1s linear infinite;">refresh</span>Loading building dots…</div>`
      : `<div id="${buildingStatusId}" style="margin-top:6px;"><button class="zp-btn" data-act="load-buildings" data-zone="${zoneNumber}" style="font-size:9px;padding:4px 8px;"><span class="material-icons-outlined" style="font-size:12px;">grid_on</span>Show buildings</button></div>`;

    const html=`
      <div style="text-align:left;">
        <div class="pp-title zone">
          <span class="material-icons-outlined">layers</span>Sub-zone ${displayName}
        </div>
        <div class="pp-row"><span class="material-icons-outlined" style="color:#1976d2;">mail</span>Flyers: <strong>${flyers||'-'}</strong></div>
        ${flyersReqHtml}
        <div class="pp-row"><span class="material-icons-outlined" style="color:${meta.color};">info</span>Status: <strong>${meta.text}</strong></div>
        ${buildingHtml}
        <div class="pp-actions">${actionButtons}</div>
        ${gpsHtml}${proofImgHtml}
      </div>`;

    activePopup=new maplibregl.Popup({ closeButton:true, closeOnClick:false, offset:[0,-8], maxWidth:'280px' })
      .setLngLat(lngLat).setHTML(html).addTo(map);
    activePopup.on('close', ()=>{ clearBuildingDots(); activePopup=null; });

    if(autoLoadBuildings){
      computeBuildingCount(zoneNumber).then(count=>{
        const data=buildingDataByZone.get(zoneNumber);
        if(data&&data.centers.length>0) showBuildingDots(data.centers);
        const statusEl=document.getElementById(buildingStatusId);
        if(statusEl){
          if(count>0) statusEl.innerHTML=`<span class="material-icons-outlined">location_on</span><strong>${count}</strong>&nbsp;buildings shown`;
          else statusEl.innerHTML=`<span class="material-icons-outlined">info</span>No building data found`;
        }
      }).catch(()=>{ const s=document.getElementById(buildingStatusId); if(s) s.innerHTML=`<span style="color:#e41e3f;">Building data unavailable</span>`; });
    }

    setTimeout(()=>{
      const popupEl=activePopup?.getElement(); if(!popupEl) return;
      const img=popupEl.querySelector('[data-proof]');
      if(img) img.addEventListener('click', ()=>showModal('imgModal',img.dataset.proof));
      popupEl.querySelectorAll('.zp-btn[data-act]').forEach(btn=>{
        btn.addEventListener('click', async e=>{
          e.preventDefault();
          const act=btn.dataset.act, znum=btn.dataset.zone;
          if(act==='load-buildings'){
            btn.disabled=true; btn.innerHTML='<span class="material-icons-outlined" style="font-size:12px;animation:spin 1s linear infinite;">refresh</span>Loading…';
            const count=await computeBuildingCount(znum);
            const data=buildingDataByZone.get(znum);
            if(data&&data.centers.length>0) showBuildingDots(data.centers);
            const statusEl=document.getElementById(buildingStatusId);
            if(statusEl){
              if(count>0) statusEl.innerHTML=`<span class="material-icons-outlined" style="font-size:12px;">location_on</span><strong>${count}</strong>&nbsp;buildings shown`;
              else statusEl.innerHTML=`<span style="font-size:10px;color:#6b7280;">No building data found</span>`;
            }
            return;
          }
          if(act==='del-subzone'){
            requestPin(()=>{ deleteSubZone(znum); });
            return;
          }
          btn.disabled=true; btn.textContent='Working…';
          if(act==='book'){
            btn.innerHTML='<span class="material-icons-outlined" style="font-size:13px;animation:spin 1s linear infinite;">refresh</span> Loading…';
            const count=await computeBuildingCount(znum);
            if(count) showBuildingDots(buildingDataByZone.get(znum)?.centers||[]);
            else toast('No building data — booked without flyer estimate');
            await applyStatusToZones([znum],'booked');
          } else if(act==='unbook'){
            await applyStatusToZones([znum],'pending');
          } else if(act==='verify'){
            await verifyZone(znum);
          }
          if(activePopup){ activePopup.remove(); activePopup=null; }
        });
      });
    },60);
  }

  async function applyStatusToZones(zones, newStatus){
    const updates={};
    zones.forEach(zoneNum=>{
      let nodeKey=zoneStatusKeyByZone.get(zoneNum)||String(zoneNum);
      updates[`${nodeKey}/status`]=newStatus;
      updates[`${nodeKey}/zoneName`]=zoneNum;
      updates[`${nodeKey}/zoneNumber`]=zoneNum;
      if(newStatus==='completed') updates[`${nodeKey}/completedAt`]=serverTimestamp();
    });
    await update(ref(db, ZONE_STATUS_PATH), updates);
    if(newStatus==='booked'){
      for(const z of zones){
        const statusObj=zoneStatusByZone.get(z)||{};
        if(typeof statusObj.flyersRequired==='number') continue;
        const count=await computeBuildingCount(z);
        if(count){
          const nodeKey=zoneStatusKeyByZone.get(z)||String(z);
          await update(ref(db,`${ZONE_STATUS_PATH}/${nodeKey}`),{ flyersRequired: count*2 });
        }
      }
    }
  }

  async function verifyZone(zoneNum){
    const key=zoneStatusKeyByZone.get(zoneNum);
    if(!key) return;
    try { await update(ref(db,`${ZONE_STATUS_PATH}/${key}`),{ verifiedAt: serverTimestamp() }); }
    catch(e){ alert('Verify failed.'); }
  }

  window.focusZone = function(zoneNum){
    const idx=polygonsByZone.get(zoneNum); if(idx===undefined) return;
    const meta=polygonMeta[idx]; if(!meta) return;
    const b=meta.bounds;
    map.fitBounds([[b.minLng,b.minLat],[b.maxLng,b.maxLat]],{padding:60,duration:900});
    setTimeout(()=>{ map.flyTo({center:meta.center,zoom:Math.max(map.getZoom(),15),duration:600}); },200);
  };

  /* ── Building dots (Overpass) ── */
  async function computeBuildingCount(zoneNum){
    if(buildingDataByZone.has(zoneNum)) return buildingDataByZone.get(zoneNum).count;
    if(buildingFetchPromises.has(zoneNum)){ await buildingFetchPromises.get(zoneNum); return buildingDataByZone.get(zoneNum)?.count||0; }
    const idx=polygonsByZone.get(zoneNum);
    if(idx===undefined){ buildingDataByZone.set(zoneNum,{centers:[],count:0}); return 0; }
    const meta=polygonMeta[idx];
    const ring=meta.turfPoly.geometry.coordinates[0];
    const polyStr=ring.map(([lng,lat])=>`${lat} ${lng}`).join(' ');
    const query=`[out:json][timeout:25];(node["building"](poly:"${polyStr}");way["building"](poly:"${polyStr}");relation["building"](poly:"${polyStr}"););out center;`;
    const prom=fetch('https://overpass-api.de/api/interpreter',{
      method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'}, body:'data='+encodeURIComponent(query)
    }).then(r=>{ if(!r.ok) throw new Error('Overpass error'); return r.json(); })
    .then(data=>{
      const elements=data?.elements||[]; const centers=[]; const seen=new Set();
      elements.forEach(el=>{
        let lat,lon;
        if(el.type==='node'&&typeof el.lat==='number'){lat=el.lat;lon=el.lon;}
        else if(el.center){lat=el.center.lat;lon=el.center.lon;}
        if(typeof lat==='number'){ const k=el.type+':'+el.id; if(!seen.has(k)){seen.add(k);centers.push([lat,lon]);} }
      });
      buildingDataByZone.set(zoneNum,{centers,count:centers.length});
      return centers.length;
    }).catch(()=>{ buildingDataByZone.set(zoneNum,{centers:[],count:0}); return 0; })
    .finally(()=>buildingFetchPromises.delete(zoneNum));
    buildingFetchPromises.set(zoneNum,prom);
    return prom;
  }

  /* ── Live worker clicks (FF<CODE>) ──
     green + blue = YES / delivered
     red          = NO / not delivered
     legacy entries without a color are treated as blue/YES. */
  function listenLiveDots(){
    onValue(ref(dotsDb,`userPosts/${CAMPAIGN_FF}`), snap => {
      const dotsList=[];
      if(snap.exists()){
        snap.forEach(child=>{
          const v=child.val();
          if(!v||typeof v.lat!=='number'||typeof v.lng!=='number') return;
          const rawColor=String(v.color||'blue').toLowerCase();
          if(rawColor==='orange') return;
          const outcome=rawColor==='red'?'no':'yes';
          dotsList.push({
            lat:v.lat,
            lng:v.lng,
            ts:Number(v.timestamp)||0,
            key:String(child.key||''),
            color:rawColor,
            outcome
          });
        });
      }

      dotsList.sort((a,b)=>(a.ts-b.ts)||a.key.localeCompare(b.key));
      let deliveredRunning=0;
      dotsList.forEach((d,i)=>{
        d.seq=i;
        if(d.outcome==='yes') deliveredRunning++;
        d.deliveredSeq=deliveredRunning;
      });
      liveDotsHistory=dotsList;

      const yesDots=dotsList.filter(d=>d.outcome==='yes'); // green + blue, used for Delivered/YES totals
      const greenDots=yesDots.filter(d=>d.color!=='blue');
      const blueWorkerDots=yesDots.filter(d=>d.color==='blue');
      const noDots=dotsList.filter(d=>d.outcome==='no');

      const greenFeatures=greenDots.map(d=>feat('Point',[d.lng,d.lat],{
        outcome:'yes',color:d.color,seq:d.seq,deliveredSeq:d.deliveredSeq,ts:d.ts
      }));
      const blueWorkerFeatures=blueWorkerDots.map(d=>feat('Point',[d.lng,d.lat],{
        outcome:'yes',color:'blue',seq:d.seq,deliveredSeq:d.deliveredSeq,ts:d.ts
      }));
      const noFeatures=noDots.map(d=>feat('Point',[d.lng,d.lat],{
        outcome:'no',color:d.color,seq:d.seq,deliveredSeq:d.deliveredSeq,ts:d.ts
      }));

      // Always publish EVERY saved point to its dedicated visual source.
      // Replay never filters these tiny point layers.
      if(map.getSource('yes-dots-src')) map.getSource('yes-dots-src').setData(fc(greenFeatures));
      if(map.getSource('worker-blue-dots-src')) map.getSource('worker-blue-dots-src').setData(fc(blueWorkerFeatures));
      if(map.getSource('no-dots-src')) map.getSource('no-dots-src').setData(fc(noFeatures));
      if(map.getSource('blue-dots-src')){
        const trailCoords=dotsList.map(d=>[d.lng,d.lat]);
        map.getSource('blue-dots-src').setData(
          fc(dotsList.length>=2?[feat('LineString',trailCoords,{kind:'worker-trail'})]:[])
        );
      }

      // Reassert the drawing order after live updates. This is cheap and ensures
      // delivery dots remain above polygon/building layers even if other UI code
      // adds or reorders layers later.
      try{
        // Keep the blue route below the outcome dots, while keeping all three above
        // ordinary map/building layers.
        if(map.getLayer('blue-trail')) map.moveLayer('blue-trail');
        if(map.getLayer('yes-dots')) map.moveLayer('yes-dots');
        if(map.getLayer('worker-blue-dots')) map.moveLayer('worker-blue-dots');
        if(map.getLayer('no-dots')) map.moveLayer('no-dots');
      }catch(e){}

      // Build separate per-zone YES, NO and total counters.
      // The existing dotsCountByZone remains YES-only so red/NO clicks never
      // make a zone look delivered/completed in the existing visual logic.
      dotsCountByZone.clear();
      yesDotsCountByZone.clear();
      noDotsCountByZone.clear();
      totalDotsCountByZone.clear();

      const countDotInZone = (dot, outcome) => {
        const pt=[dot.lng,dot.lat];
        for(const meta of polygonMeta){
          if(dot.lng<meta.bounds.minLng||dot.lng>meta.bounds.maxLng||dot.lat<meta.bounds.minLat||dot.lat>meta.bounds.maxLat) continue;
          if(turf.booleanPointInPolygon(pt, meta.turfPoly)){
            const z=meta.zoneNumber;
            if(outcome==='yes'){
              dotsCountByZone.set(z,(dotsCountByZone.get(z)||0)+1);
              yesDotsCountByZone.set(z,(yesDotsCountByZone.get(z)||0)+1);
            } else {
              noDotsCountByZone.set(z,(noDotsCountByZone.get(z)||0)+1);
            }
            totalDotsCountByZone.set(z,(totalDotsCountByZone.get(z)||0)+1);
            break;
          }
        }
      };

      yesDots.forEach(dot=>countDotInZone(dot,'yes'));
      noDots.forEach(dot=>countDotInZone(dot,'no'));

      yesDotsCountEl.textContent=yesDots.length.toLocaleString();
      noDotsCountEl.textContent=noDots.length.toLocaleString();
      b2bDotsCountEl.textContent=blueWorkerDots.length.toLocaleString();

      idle(updateZonesVisual);
      updateLatestDotUI(yesDots.length, dotsList[dotsList.length-1]||null);
      firstLoad.dots.resolve();
    });
  }

  // All tiny green/blue/red worker dots stay visible before, during and after history playback.
  // There are no replay filters on these layers; this function only makes sure
  // they are visible and on top of the map's normal data layers.
  function restoreFullDotView(){
    if(!map) return;
    if(map.getLayer('yes-dots')) map.setLayoutProperty('yes-dots','visibility','visible');
    if(map.getLayer('worker-blue-dots')) map.setLayoutProperty('worker-blue-dots','visibility','visible');
    if(map.getLayer('no-dots')) map.setLayoutProperty('no-dots','visibility','visible');
    if(map.getLayer('blue-trail')) map.setLayoutProperty('blue-trail','visibility','visible');
    try{
      if(map.getLayer('blue-trail')) map.moveLayer('blue-trail');
      if(map.getLayer('yes-dots')) map.moveLayer('yes-dots');
      if(map.getLayer('worker-blue-dots')) map.moveLayer('worker-blue-dots');
      if(map.getLayer('no-dots')) map.moveLayer('no-dots');
    }catch(e){}
  }

  function ensureReplayMarker(){
    if(replayMarker) return replayMarker;
    const el=document.createElement('div');
    el.className='replay-marker-wrap';
    el.innerHTML='<div class="replay-count-badge"><div class="replay-count-main">1 / 1</div><div class="replay-age-badge" style="display:none"></div></div><div class="replay-focus-dot"></div>';
    replayMarker=new maplibregl.Marker({element:el,anchor:'bottom'});
    return replayMarker;
  }

  function formatDeliveryAge(timestamp){
    const ts=Number(timestamp)||0;
    if(!ts) return '';
    const diff=Math.max(0,Date.now()-ts);
    const totalHours=Math.floor(diff/3600000);
    const days=Math.floor(totalHours/24);
    const hours=totalHours%24;
    if(totalHours<1) return '<1h ago';
    return `${days}d ${hours}h ago`;
  }

  function updateReplayMarker(dot,index){
    const marker=ensureReplayMarker();
    const el=marker.getElement();
    const countMain=el.querySelector('.replay-count-main');
    const ageBadge=el.querySelector('.replay-age-badge');
    const focus=el.querySelector('.replay-focus-dot');
    const totalDelivered=liveDotsHistory.length ? Number(liveDotsHistory[liveDotsHistory.length-1].deliveredSeq||0) : 0;
    const deliveredAtDot=Number(dot.deliveredSeq||0);
    countMain.textContent=`${deliveredAtDot.toLocaleString()} / ${totalDelivered.toLocaleString()}`;
    if(ageBadge){
      if(replayActive){
        ageBadge.textContent=formatDeliveryAge(dot.ts);
        ageBadge.style.display='block';
      } else {
        ageBadge.textContent='';
        ageBadge.style.display='none';
      }
    }
    focus.classList.toggle('no',dot.outcome==='no');
    focus.classList.toggle('blue',dot.outcome==='yes' && dot.color==='blue');
    marker.setLngLat([dot.lng,dot.lat]);
    if(!marker.getElement().isConnected) marker.addTo(map);

    // Follow the replay only when the highlighted point falls outside the comfortable viewport.
    try{
      const pt=map.project([dot.lng,dot.lat]);
      const c=map.getContainer();
      const marginX=c.clientWidth*0.14, marginY=c.clientHeight*0.16;
      if(pt.x<marginX||pt.x>c.clientWidth-marginX||pt.y<marginY||pt.y>c.clientHeight-marginY){
        const speed=Math.max(1,Number(replaySpeedEl?.value)||1);
        map.easeTo({center:[dot.lng,dot.lat],duration:Math.max(70,220/speed),essential:true});
      }
    }catch(e){}
  }

  function updateReplayControls(){
    if(!tbReplay) return;
    tbReplay.classList.toggle('replaying',replayActive&&!replayPaused);
    tbReplay.classList.toggle('paused',replayActive&&replayPaused);
    if(!replayActive){
      replayIcon.textContent='play_arrow';
      replayLabel.textContent='History';
    } else if(replayPaused){
      replayIcon.textContent='play_arrow';
      const d=liveDotsHistory[Math.max(0,replayIndex)];
      replayLabel.textContent=d?`${Number(d.deliveredSeq||0).toLocaleString()}`:'History';
    } else {
      replayIcon.textContent='pause';
      const d=liveDotsHistory[Math.max(0,replayIndex)];
      replayLabel.textContent=d?`${Number(d.deliveredSeq||0).toLocaleString()}`:'History';
    }
  }

  function clearReplayTimer(){
    if(replayTimer){ clearTimeout(replayTimer); replayTimer=null; }
  }

  function finishReplay(){
    clearReplayTimer();
    replayActive=false;
    replayPaused=false;
    restoreFullDotView();
    updateReplayControls();
    // Return the same large marker to the newest live dot after the reverse replay finishes.
    if(liveDotsHistory.length){
      const latestIndex=liveDotsHistory.length-1;
      replayIndex=latestIndex;
      updateReplayMarker(liveDotsHistory[latestIndex],latestIndex);
    }
  }

  function replayStep(){
    clearReplayTimer();
    if(!replayActive||replayPaused) return;
    if(!liveDotsHistory.length){
      replayActive=false;
      updateReplayControls();
      toast('No distribution history yet');
      return;
    }

    if(replayIndex<0){ finishReplay(); return; }

    const dot=liveDotsHistory[replayIndex];
    updateReplayMarker(dot,replayIndex);
    updateReplayControls();

    replayIndex--;
    const speed=Math.max(1,Number(replaySpeedEl?.value)||1);
    replayTimer=setTimeout(replayStep,Math.max(35,REPLAY_BASE_DELAY/speed));
  }

  function startReplay(){
    if(!liveDotsHistory.length){ toast('No distribution history yet'); return; }
    clearReplayTimer();
    replayActive=true;
    replayPaused=false;
    // Reverse playback starts at the newest tiny dot and walks back to the oldest.
    replayIndex=liveDotsHistory.length-1;
    restoreFullDotView();
    updateReplayControls();
    replayStep();
  }

  function toggleReplay(){
    if(!replayActive){ startReplay(); return; }
    if(replayPaused){
      replayPaused=false;
      updateReplayControls();
      replayStep();
    } else {
      replayPaused=true;
      clearReplayTimer();
      updateReplayControls();
    }
  }

  function updateLatestDotUI(total, latest){
    // Official Delivered = YES only (green + blue). NO/red stays visible but never increments this total.
    completedFlyersCountEl.textContent=total.toLocaleString();
    if(!latest){
      if(replayMarker){ replayMarker.remove(); replayMarker=null; }
      return;
    }
    // The large history marker doubles as the live count marker whenever history is not playing.
    if(!replayActive){
      updateReplayMarker(latest,liveDotsHistory.length-1);
    }
  }

  /* ── Proofs ── */
  const PROOFS_PATH='campaigns/' + CAMPAIGN_XX + '/proofs';
  function listenProofs(){
    onValue(ref(db, PROOFS_PATH), snap=>{
      proofMarkerMap.forEach(m=>m.remove()); proofMarkerMap.clear(); proofsList=[];
      const val=snap.val();
      if(val){ for(const id in val){ const p=val[id]; if(p&&typeof p.lat==='number'&&typeof p.lng==='number'&&p.url) proofsList.push({id,url:p.url,lat:p.lat,lng:p.lng,timestamp:p.timestamp||0}); } }
      proofsList.sort((a,b)=>b.timestamp-a.timestamp);
      proofsList.forEach(p=>{
        const el=document.createElement('div'); el.className='proof-ml-icon';
        el.innerHTML='<span class="material-icons-outlined">photo_camera</span>';
        const m=new maplibregl.Marker({element:el,anchor:'center'}).setLngLat([p.lng,p.lat]).addTo(map);
        el.addEventListener('mousedown',e=>e.stopPropagation());
        el.addEventListener('touchstart',e=>e.stopPropagation(),{passive:true});
        el.addEventListener('click',(e)=>{
          e.stopPropagation(); clearBuildingDots();
          if(activePopup){activePopup.remove();activePopup=null;}
          activePopup=new maplibregl.Popup({closeButton:true,offset:[0,-14]})
            .setLngLat([p.lng,p.lat])
            .setHTML(`<img src="${p.url}" data-proof="${p.url}" loading="lazy" style="max-width:240px;max-height:240px;border-radius:8px;cursor:pointer;display:block;">`).addTo(map);
          setTimeout(()=>{ const img=activePopup.getElement()?.querySelector('[data-proof]'); if(img) img.addEventListener('click',()=>showModal('imgModal',img.dataset.proof)); },60);
        });
        proofMarkerMap.set(p.id,m);
      });
      renderProofSlider();
      firstLoad.proofs.resolve();
    });
  }

  function renderProofSlider(){
    proofStripInner.innerHTML='';
    if(!proofsList.length){ proofStrip.classList.remove('visible'); return; }
    proofStrip.classList.add('visible');
    const frag=document.createDocumentFragment();
    proofsList.forEach((p,i)=>{
      const div=document.createElement('div'); div.className='proof-item'; div.dataset.id=p.id;
      div.title=p.timestamp?formatDateTime(p.timestamp):`Proof ${i+1}`;
      div.innerHTML=`<img class="proof-thumb" src="${p.url}" alt="Proof ${i+1}" loading="lazy">`;
      div.addEventListener('click',()=>{
        const m=proofMarkerMap.get(p.id);
        if(m) map.flyTo({center:[p.lng,p.lat],zoom:Math.max(map.getZoom(),16),duration:700});
        document.querySelectorAll('.proof-item').forEach(el=>el.classList.toggle('selected',el.dataset.id===p.id));
        setTimeout(()=>{
          if(activePopup){activePopup.remove();activePopup=null;}
          activePopup=new maplibregl.Popup({closeButton:true,offset:[0,-14]})
            .setLngLat([p.lng,p.lat])
            .setHTML(`<img src="${p.url}" data-proof="${p.url}" loading="lazy" style="max-width:240px;max-height:240px;border-radius:8px;cursor:pointer;display:block;">`).addTo(map);
          setTimeout(()=>{ const img=activePopup.getElement()?.querySelector('[data-proof]'); if(img) img.addEventListener('click',()=>showModal('imgModal',img.dataset.proof)); },60);
        },750);
      });
      frag.appendChild(div);
    });
    proofStripInner.appendChild(frag);
    psLeft.onclick=()=>proofStripInner.scrollBy({left:-200,behavior:'smooth'});
    psRight.onclick=()=>proofStripInner.scrollBy({left:200,behavior:'smooth'});
  }

  /* ── QR scans ── */
  function listenQrScans(){
    onValue(ref(db,'qr_scans'),snap=>{
      let count=0; const val=snap.val();
      if(val) for(const k in val){ if(val[k].promoCode===CAMPAIGN_XX) count++; }
      qrScanCountEl.textContent=count;
      firstLoad.qr.resolve();
    });
    qrCounter.addEventListener('click',()=>alert('QR scans list is only available if active for this campaign.'));
  }

  /* ── Toolbar ── */
  function syncToolbar(){
    tbMunis.classList.toggle('active', showAllZones);
    tbMunis.querySelector('.tool-label').textContent = showAllZones ? 'Hide municipalities' : 'Show all municipalities';
    tbCampaign.classList.toggle('active', showCampaignArea);
    tbCampaign.querySelector('.tool-label').textContent = showCampaignArea ? 'Hide campaign area' : 'Show campaign area';
    tbDraw.classList.toggle('draw-active', drawing);
    tbDraw.querySelector('.tool-label').textContent = drawing ? 'Stop drawing' : 'Draw subzones';
  }

  function fitToSavedMunis(){
    let minLng=Infinity,minLat=Infinity,maxLng=-Infinity,maxLat=-Infinity,any=false;
    muniByName.forEach(m=>{
      if(!m.savedKey) return;
      muniRings(m.geometry).forEach(ring=>{
        ring.forEach(([lng,lat])=>{
          any=true;
          if(lng<minLng)minLng=lng; if(lng>maxLng)maxLng=lng;
          if(lat<minLat)minLat=lat; if(lat>maxLat)maxLat=lat;
        });
      });
    });
    polygonMeta.forEach(meta=>{
      const st=zoneStatusByZone.get(meta.zoneNumber)||{};
      if(st.status!=='booked'&&st.status!=='completed') return;
      any=true;
      const b=meta.bounds;
      if(b.minLng<minLng)minLng=b.minLng; if(b.maxLng>maxLng)maxLng=b.maxLng;
      if(b.minLat<minLat)minLat=b.minLat; if(b.maxLat>maxLat)maxLat=b.maxLat;
    });
    if(any){ try{ map.fitBounds([[minLng,minLat],[maxLng,maxLat]],{padding:60,maxZoom:14,duration:700}); }catch(e){} }
    return any;
  }

  tbMunis.addEventListener('click', async e=>{
    e.stopPropagation();
    showAllZones=!showAllZones;
    if(showAllZones) showCampaignArea=false;   // mutually exclusive views
    syncToolbar();
    if(showAllZones) await loadMunicipalities();
    renderMunicipalities();
    updateZonesVisual();
  });

  tbCampaign.addEventListener('click', async e=>{
    e.stopPropagation();
    showCampaignArea=!showCampaignArea;
    if(showCampaignArea) showAllZones=false;   // mutually exclusive views
    syncToolbar();
    if(showCampaignArea){
      await loadMunicipalities();
      renderMunicipalities();
      if(!fitToSavedMunis()) toast('No campaign area yet — select a municipality or book a zone');
    } else {
      renderMunicipalities();
    }
    updateZonesVisual();
  });

  tbDraw.addEventListener('click', e=>{
    e.stopPropagation();
    if(drawing) cancelDraw();
    else startDraw(null);
  });
  dhFinish.addEventListener('click', e=>{ e.stopPropagation(); finishDraw(); });
  dhCancel.addEventListener('click', e=>{ e.stopPropagation(); cancelDraw(); });

  tbChat.addEventListener('click', e=>{
    e.stopPropagation();
    const show=chatPanel.style.display!=='flex';
    chatPanel.style.display=show?'flex':'none';
    if(show){ setHeaderHeightVar(); setTimeout(()=>{scrollChatBottom();chatInputEl.focus();},60); }
  });

  tbReplay.addEventListener('click', e=>{
    e.stopPropagation();
    toggleReplay();
  });
  replaySpeedEl.addEventListener('change',()=>{
    // Speed can be changed while the replay is running.
    if(replayActive&&!replayPaused){
      clearReplayTimer();
      const speed=Math.max(1,Number(replaySpeedEl.value)||1);
      replayTimer=setTimeout(replayStep,Math.max(35,REPLAY_BASE_DELAY/speed));
    }
  });
  document.addEventListener('click',e=>{
    if(!chatPanel.contains(e.target)&&!tbChat.contains(e.target)) chatPanel.style.display='none';
  },{passive:true});

  /* ── PIN modal ── */
  function requestPin(action){
    pinPendingAction=action; pinInput.value=''; pinErr.style.display='none';
    pinModal.classList.add('visible'); setTimeout(()=>pinInput.focus(),80);
  }
  function closePin(){ pinModal.classList.remove('visible'); pinPendingAction=null; }
  document.getElementById('pinCancel').addEventListener('click', closePin);
  pinModal.addEventListener('click', e=>{ if(e.target===pinModal) closePin(); });
  document.getElementById('pinOk').addEventListener('click', ()=>{
    if(pinInput.value===DELETE_PIN){ const a=pinPendingAction; closePin(); if(a) a(); }
    else { pinErr.style.display='block'; pinInput.value=''; pinInput.focus(); }
  });

  /* ── Chat ── */
  function getOrCreateDeviceId(){ let id=localStorage.getItem(deviceIdKey); if(!id){id='dev_'+Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);localStorage.setItem(deviceIdKey,id);} return id; }
  function getLastReadTs(){ const v=parseInt(localStorage.getItem(lastReadKey)||'0',10); return isNaN(v)?0:v; }
  function setLastReadTs(ts){ localStorage.setItem(lastReadKey,String(ts||0)); updateChatBadge(); }

  function listenChat(){
    onValue(ref(db,CHAT_PATH),snap=>{
      chatMessages=[]; const val=snap.val();
      if(val) Object.keys(val).forEach(k=>{const m=val[k];if(m&&m.text)chatMessages.push({id:k,text:String(m.text),ts:m.timestamp||0,authorId:m.authorId||'unknown',authorName:m.authorName||'User'});});
      chatMessages.sort((a,b)=>a.ts-b.ts);
      renderChat(); updateChatBadge();
      firstLoad.chat.resolve();
    });
    chatSendBtn.addEventListener('click',sendChatMsg);
    chatInputEl.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendChatMsg();}});
    chatMarkReadBtn.addEventListener('click',()=>setLastReadTs(chatMessages.length?chatMessages[chatMessages.length-1].ts||Date.now():Date.now()));
  }

  function renderChat(){
    chatListEl.innerHTML='';
    if(!chatMessages.length){ chatListEl.innerHTML='<div class="chat-empty">No messages yet.</div>'; return; }
    const frag=document.createDocumentFragment();
    chatMessages.forEach(m=>{
      const isMine=m.authorId===myDeviceId;
      const row=document.createElement('div'); row.className='chat-row'+(isMine?' mine':'');
      const avatar=document.createElement('div'); avatar.className='avatar'; avatar.textContent=(isMine?myName:m.authorName||'U')[0].toUpperCase();
      const bubble=document.createElement('div'); bubble.className='chat-msg';
      bubble.innerHTML=`<div class="chat-text">${m.text}</div><div class="chat-meta"><span class="material-icons-outlined">schedule</span><span>${formatDateTime(m.ts)}</span></div>`;
      if(isMine){row.appendChild(bubble);row.appendChild(avatar);} else {row.appendChild(avatar);row.appendChild(bubble);}
      frag.appendChild(row);
    });
    chatListEl.appendChild(frag); scrollChatBottom();
  }
  function scrollChatBottom(){ chatListEl.scrollTop=chatListEl.scrollHeight+1000; }
  async function sendChatMsg(){
    const text=(chatInputEl.value||'').trim(); if(!text) return;
    chatSendBtn.disabled=true;
    try{
      const now=Date.now();
      // Storage: dropped the redundant _serverTs field — the client `timestamp`
      // is the only one ever read, so _serverTs was pure duplication per message.
      await set(push(ref(db,CHAT_PATH)),{text,authorId:myDeviceId,authorName:myName,timestamp:now});
      chatInputEl.value=''; setLastReadTs(now); setTimeout(scrollChatBottom,60);
    }catch(e){alert('Failed to send.');}
    finally{chatSendBtn.disabled=false;}
  }
  function updateChatBadge(){
    const lr=getLastReadTs();
    const n=chatMessages.filter(m=>m.authorId!==myDeviceId&&(m.ts||0)>lr).length;
    tbChatBadge.textContent=String(n);
    tbChatBadge.style.display=n>0?'inline-block':'none';
  }

  /* ── Modal ── */
  function showModal(id,imgUrl){ const m=document.getElementById(id);if(!m)return;if(id==='imgModal'){const img=document.getElementById('modalImg');if(img)img.src=imgUrl||'';}m.style.display='flex';document.body.style.overflow='hidden'; }
  function hideModal(id){ const m=document.getElementById(id);if(!m)return;m.style.display='none';if(id==='imgModal')document.getElementById('modalImg').src='';const any=Array.from(document.querySelectorAll('.modal')).some(mm=>mm.style.display==='flex');if(!any)document.body.style.overflow=''; }
  document.getElementById('modalCloseBtn').addEventListener('click',()=>hideModal('imgModal'));
  document.getElementById('imgModal').addEventListener('click',e=>{if(e.target.id==='imgModal')hideModal('imgModal');});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'){hideModal('imgModal'); if(drawing) cancelDraw();}});

  /* ── Helpers ── */
  function hideLoader(){
    if(!loadingOverlay||loadingOverlay.classList.contains('fade-out'))return;
    setLoadProgress(100, 'Ready');
    setTimeout(()=>{
      document.body.classList.add('app-ready');
      loadingOverlay.classList.add('fade-out');
      setTimeout(()=>{
        loadingOverlay.remove();
        try{ if(map) map.resize(); }catch(e){}
      }, 280);
    }, 300);
  }
  function safeInt(v){ const n=parseInt(v); return isNaN(n)?0:n; }
  function statusMeta(status){
    switch(status){
      case 'completed': return{text:'Done',color:'#2e7d32',icon:'task_alt'};
      case 'inprogress': return{text:'Active',color:'#F5C33B',icon:'play_arrow'};
      case 'booked': return{text:'Booked',color:'#F5C33B',icon:'bookmark_added'};
      default: return{text:'Pending',color:'#d32f2f',icon:'hourglass_empty'};
    }
  }
  function formatDateTime(ts){ if(!ts)return''; const d=new Date(ts),p=n=>String(n).padStart(2,'0'); return`${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`; }

  // Last-resort failsafe (must outlast the 20s Firebase first-snapshot window)
  setTimeout(()=>{ try{hideLoader();}catch{} },30000);
  </script>
</body>
</html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111214"><title>Daily Notes</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:#111214;color:#f3f3f3;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}body{min-height:100dvh}button,input,textarea{font:inherit}.app{min-height:100dvh;max-width:760px;margin:auto;background:#151619}.top{position:sticky;top:0;z-index:5;background:rgba(17,18,20,.95);backdrop-filter:blur(14px);border-bottom:1px solid #2b2c31;padding:calc(10px + env(safe-area-inset-top)) 12px 10px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.brand{display:flex;align-items:center;gap:9px}.logo{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:#f2f2f2;color:#111}.title{font-size:15px;font-weight:600}.sync{font-size:11px;color:#9a9a9f}.sync.ok{color:#10a37f}.sync.err{color:#d84b4b}.btn,.mini{border:1px solid #2b2c31;background:#151619;color:#e6e6e6;border-radius:10px}.btn{padding:8px 11px;font-size:12px}.nav{display:grid;grid-template-columns:42px 1fr 42px;gap:8px;margin-top:10px}.arrow{height:42px;font-size:20px}.date{position:relative;text-align:center;background:#1b1c1f;border:1px solid #2b2c31;border-radius:12px;padding:7px 38px}.dm{font-size:14px;font-weight:600}.ds{font-size:10px;color:#9a9a9f;margin-top:2px}#pick{position:absolute;inset:0;width:100%;height:100%;opacity:0}main{padding:18px 14px calc(100px + env(safe-area-inset-bottom))}h1{margin:0;font-size:27px;letter-spacing:-.7px}.sub{margin:7px 0 16px;color:#9a9a9f;font-size:12px}.compose,.note,.empty{border:1px solid #2b2c31;background:#151619;border-radius:16px}.compose{overflow:hidden;margin-bottom:20px;box-shadow:0 8px 30px rgba(0,0,0,.3)}textarea{width:100%;background:#111214;color:#f3f3f3;border:0;outline:0;resize:none}.compose textarea{min-height:110px;max-height:260px;padding:15px 15px 8px;font-size:14px;line-height:1.5}.compose textarea::placeholder{color:#74767d}.composebar{display:flex;justify-content:space-between;align-items:center;padding:8px 10px 10px 12px}.hint{font-size:10px;color:#8f9096}.save{height:36px;min-width:74px;border:0;border-radius:11px;background:#f2f2f2;color:#111;font-size:12px}.save:disabled{opacity:.35}.sect{display:flex;justify-content:space-between;align-items:center;margin:0 2px 9px;font-size:12px;color:#b7b7bc}.count{background:#1b1c1f;color:#9a9a9f;border-radius:999px;padding:4px 8px;font-size:10px}.notes{display:flex;flex-direction:column;gap:10px}.note{padding:13px}.text{white-space:pre-wrap;word-break:break-word;font-size:14px;line-height:1.5}.bottom{display:flex;justify-content:space-between;align-items:center;margin-top:11px}.time{font-size:10px;color:#8f9096}.acts{display:flex;gap:5px}.mini{height:30px;padding:0 9px;font-size:10px}.del{color:#d84b4b}.empty{text-align:center;padding:48px 20px;color:#8f9096;border-style:dashed}.empty strong{display:block;color:#b7b7bc;font-size:13px;margin-bottom:5px}.edit{min-height:100px;border:1px solid #2b2c31;border-radius:11px;padding:10px;font-size:14px;line-height:1.5}.editbar{display:flex;justify-content:flex-end;gap:7px;margin-top:8px}.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translate(-50%,18px);background:#f2f2f2;color:#111;font-size:11px;padding:10px 13px;border-radius:11px;opacity:0;pointer-events:none;transition:.2s;z-index:20}.toast.show{opacity:1;transform:translate(-50%,0)}</style></head><body><div class="app"><header class="top"><div class="row"><div class="brand"><div class="logo">✦</div><div><div class="title">Daily Notes</div><div id="sync" class="sync">Connecting…</div></div></div><button id="today" class="btn">Today</button></div><div class="nav"><button id="prev" class="btn arrow">‹</button><div class="date"><div id="dm" class="dm"></div><div id="ds" class="ds"></div><input id="pick" type="date"></div><button id="next" class="btn arrow">›</button></div></header><main><h1 id="day">Today</h1><p id="sub" class="sub">Write down anything you want to remember.</p><section class="compose"><textarea id="input" placeholder="Add a note for this day…"></textarea><div class="composebar"><div class="hint">Saved to Firebase</div><button id="add" class="save" disabled>Save</button></div></section><div class="sect"><span>Notes</span><span id="count" class="count">0</span></div><section id="notes" class="notes"></section></main></div><div id="toast" class="toast"></div><script type="module">import{initializeApp}from"https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";import{getDatabase,ref,push,set,update,remove,onValue,serverTimestamp}from"https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";const $=x=>document.getElementById(x);async function cfg(){const s=await fetch('../autosav/index.html',{cache:'no-store'}).then(r=>r.text()),b=s.match(/const\s+firebaseConfig\s*=\s*\{([\s\S]*?)\};/),p=k=>{const m=b?.[1].match(new RegExp(k+'\\s*:\\s*["\\\']([^"\\\']+)["\\\']'));return m?m[1]:''};return{apiKey:p('apiKey'),authDomain:p('authDomain'),projectId:p('projectId'),storageBucket:p('storageBucket'),messagingSenderId:p('messagingSenderId'),appId:p('appId'),databaseURL:p('databaseURL')}}const db=getDatabase(initializeApp(await cfg())),ROOT='dailyNotes';let d=noon(new Date()),off=null,data={};function noon(x){x=new Date(x);x.setHours(12,0,0,0);return x}function key(x){return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')}function from(k){let[a,b,c]=k.split('-').map(Number);return noon(new Date(a,b-1,c))}function same(a,b){return key(a)===key(b)}function fmt(x,o){return new Intl.DateTimeFormat('en-BE',o).format(x)}function title(x){const t=noon(new Date()),y=new Date(t),m=new Date(t);y.setDate(t.getDate()-1);m.setDate(t.getDate()+1);return same(x,t)?'Today':same(x,y)?'Yesterday':same(x,m)?'Tomorrow':fmt(x,{weekday:'long'})}function ui(){const full=fmt(d,{year:'numeric',month:'long',day:'numeric'});$('dm').textContent=fmt(d,{weekday:'long',day:'numeric',month:'long'});$('ds').textContent=full;$('day').textContent=title(d);$('sub').textContent=same(d,new Date())?'Write down anything you want to remember.':'Notes for '+full+'.';$('pick').value=key(d)}function status(t,c=''){$('sync').textContent=t;$('sync').className='sync '+c}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function toast(t){$('toast').textContent=t;$('toast').classList.add('show');clearTimeout($('toast').x);$('toast').x=setTimeout(()=>$('toast').classList.remove('show'),1600)}function render(){const a=Object.entries(data||{}).map(([id,n])=>({id,...n})).sort((x,y)=>(y.createdAt||0)-(x.createdAt||0));$('count').textContent=a.length;if(!a.length){$('notes').innerHTML='<div class="empty"><strong>No notes for this day</strong>Write something above and tap Save.</div>';return}$('notes').innerHTML=a.map(n=>`<article class="note" data-id="${n.id}"><div class="text">${esc(n.text)}</div><div class="bottom"><div class="time">${n.createdAt?fmt(new Date(n.createdAt),{hour:'2-digit',minute:'2-digit'}):''}${n.updatedAt?' · edited':''}</div><div class="acts"><button class="mini edit">Edit</button><button class="mini del">Delete</button></div></div></article>`).join('');document.querySelectorAll('.edit').forEach(b=>b.onclick=()=>edit(b.closest('.note').dataset.id));document.querySelectorAll('.del').forEach(b=>b.onclick=()=>del(b.closest('.note').dataset.id))}function load(){if(off)off();ui();status('Syncing…');off=onValue(ref(db,`${ROOT}/${key(d)}/notes`),s=>{data=s.val()||{};render();status('Synced','ok')},e=>status('Firebase error','err'))}async function add(){const t=$('input').value.trim();if(!t)return;$('add').disabled=true;try{await set(push(ref(db,`${ROOT}/${key(d)}/notes`)),{text:t,createdAt:Date.now(),serverCreatedAt:serverTimestamp()});$('input').value='';toast('Note saved')}catch(e){toast('Could not save')}finally{$('add').disabled=!$('input').value.trim()}}function edit(id){const c=document.querySelector(`.note[data-id="${CSS.escape(id)}"]`),n=data[id];c.innerHTML=`<textarea class="edit">${esc(n.text)}</textarea><div class="editbar"><button class="mini cancel">Cancel</button><button class="mini saveedit">Save</button></div>`;const a=c.querySelector('textarea');a.focus();c.querySelector('.cancel').onclick=render;c.querySelector('.saveedit').onclick=async()=>{const t=a.value.trim();if(t){await update(ref(db,`${ROOT}/${key(d)}/notes/${id}`),{text:t,updatedAt:Date.now()});toast('Note updated')}}}async function del(id){if(confirm('Delete this note?')){await remove(ref(db,`${ROOT}/${key(d)}/notes/${id}`));toast('Note deleted')}}function move(n){d=new Date(d);d.setDate(d.getDate()+n);d=noon(d);history.replaceState(null,'','#'+key(d));load()}$('input').oninput=()=>{$('add').disabled=!$('input').value.trim()};$('add').onclick=add;$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);$('today').onclick=()=>{d=noon(new Date());history.replaceState(null,'','#'+key(d));load()};$('pick').onchange=()=>{if($('pick').value){d=from($('pick').value);history.replaceState(null,'','#'+key(d));load()}};let sx=0,sy=0;document.ontouchstart=e=>{sx=e.touches[0]?.clientX||0;sy=e.touches[0]?.clientY||0};document.ontouchend=e=>{let x=e.changedTouches[0]?.clientX-sx,y=e.changedTouches[0]?.clientY-sy;if(Math.abs(x)>70&&Math.abs(x)>Math.abs(y)*1.4)move(x<0?1:-1)};const h=location.hash.slice(1);if(/^\d{4}-\d{2}-\d{2}$/.test(h))d=from(h);else history.replaceState(null,'','#'+key(d));load();</script></body></html>

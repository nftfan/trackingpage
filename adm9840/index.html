<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<title>LeuvenFlyers Admin</title>
<style>
:root{color-scheme:dark;font:16px/1.5 Inter,system-ui,sans-serif;background:#131517;color:#f4f4f1}
*{box-sizing:border-box;touch-action:manipulation}body{margin:0}main{max-width:560px;margin:auto;padding:clamp(22px,5vw,36px) 18px}
header,.row{display:flex;align-items:center;justify-content:space-between;gap:12px}header{border-bottom:1px solid #383c3d;padding-bottom:18px;margin-bottom:26px}.brand{font-weight:750;letter-spacing:-.04em}.brand span{color:#d8e993;margin-left:8px;font-weight:550;letter-spacing:0}
h1{font-size:clamp(23px,6vw,30px);line-height:1.2;margin:0 0 20px;letter-spacing:-.04em}
form{margin:0}fieldset{border:0;margin:0;padding:0;min-width:0}label,summary{font-weight:600}label.field{display:grid;gap:6px;margin:0 0 17px}
input,button{font:inherit;border:1px solid #474c4e;border-radius:6px;background:#222527;color:inherit}
input:not([type=checkbox]){width:100%;padding:10px 12px;min-height:45px}input:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid #daed95;outline-offset:2px}
button{cursor:pointer;padding:8px 12px;min-height:40px}button.primary{width:100%;background:#d7e992;border-color:#d7e992;color:#182008;font-weight:750;margin-top:10px;min-height:46px}
button:disabled{opacity:.5;cursor:wait}small,.muted{color:#b5bcb9;font-size:13px}details{border-block:1px solid #383c3d;margin:20px 0 8px;padding:14px 0}
summary{cursor:pointer}summary span{float:right;font-size:13px;color:#bbe2cd}.list{max-height:270px;overflow:auto}.list label{display:flex;gap:10px;align-items:center;padding:8px 2px;font-size:14px}.list input{accent-color:#d7e992;width:18px;height:18px}.tools{display:flex;gap:8px;margin:12px 0}.tools button{font-size:13px}.status{min-height:1.5em;color:#cae5b2}.error{color:#ffaaa4}[hidden]{display:none!important}
</style></head><body><main><header><div class="brand">LeuvenFlyers<span>Admin</span></div><button id="close" hidden>Change campaign</button></header>
<form id="login"><fieldset id="access"><h1>Open campaign</h1><label class="field">FF campaign ID<input id="ff" required maxlength="10" autocapitalize="characters" spellcheck="false" placeholder="FF320378"></label>
<button id="open" class="primary" disabled>Open campaign</button></fieldset></form>
<form id="editor" hidden><fieldset id="fields"><h1 id="heading"></h1><label class="field">Campaign dot target<input id="target" type="number" min="1" max="10000000" step="1" inputmode="numeric" placeholder="Not set"></label>
<label class="field">Shift salary (€)<input id="salary" inputmode="decimal" placeholder="Not set"><small>Leave empty to clear the salary.</small></label>
<details id="segments"><summary>Assigned segments <span id="count"></span></summary><div id="segmentTools" class="tools"><button type="button" id="all">Select all</button><button type="button" id="none">Clear all</button></div><div id="list" class="list"></div><small id="listStatus"></small></details>
<button class="primary">Save changes</button></fieldset></form><p class="status" id="status" role="status">Connecting…</p></main>
<script type="module">
const el = id => document.getElementById(id);
function message(text, error=false){el('status').textContent=text;el('status').classList.toggle('error',error);}
let api, db, polyDb, campaign='', initial={}, busy=false;
const selected = () => [...el('list').querySelectorAll('input')];
function showCount(){el('count').textContent=selected().filter(box=>box.checked).length+' selected';}
function buildSegments(snapshot, assigned){
  el('list').replaceChildren();
  let number=0;
  snapshot.forEach(child=>{
    number++;
    const data=child.val();
    if(!data || Object.keys(data).filter(k=>!isNaN(Number(k))).length<2)return;
    const label=document.createElement('label'), box=document.createElement('input');
    box.type='checkbox';box.value=child.key;box.checked=assigned[child.key]===true;
    label.append(box,document.createTextNode('Segment #'+number));el('list').append(label);
  });
  el('segmentTools').hidden=!selected().length;
  el('listStatus').textContent=selected().length?'':'No segments available.';
  showCount();
}
let segmentSession=0, segmentState='idle';
el('segments').ontoggle=async ()=>{
  if(!campaign || !el('segments').open || segmentState!=='idle')return;
  const session=segmentSession;
  segmentState='loading';
  el('listStatus').textContent='Loading segments…';
  try{
    const snapshot=await api.get(api.ref(polyDb,'segments'));
    if(session!==segmentSession)return;
    buildSegments(snapshot,initial.segmentKeys||{});
    segmentState='ready';
  }catch{
    if(session!==segmentSession)return;
    segmentState='idle';
    el('listStatus').textContent='Could not load segments. Close and reopen this section to retry.';
  }
};
el('list').onchange=showCount;
for(const [id,checked] of [['all',true],['none',false]])el(id).onclick=()=>{for(const box of selected())box.checked=checked;showCount();};
el('close').onclick=()=>{
  if(busy)return;
  segmentSession++;campaign='';initial={};el('editor').hidden=true;el('close').hidden=true;
  el('login').hidden=false;el('segments').open=false;el('list').replaceChildren();message('');el('ff').focus();
};
el('login').onsubmit=async e=>{
  e.preventDefault();if(busy||!api)return;
  const id=el('ff').value.trim().toUpperCase();
  if(!/^[A-Z0-9]{3,10}$/.test(id)){message('Enter a valid campaign ID.',true);return;}
  busy=true;el('access').disabled=true;message('Opening campaign…');
  try{
    const settings=await api.get(api.ref(db,'users/'+id+'/campaignSettings'));
    initial=settings.val()||{};
    el('target').value=initial.targetDots??'';
    el('salary').value=Number.isSafeInteger(initial.shiftSalaryCents)?(initial.shiftSalaryCents/100).toFixed(2):'';
    segmentSession++;
    segmentState='idle';
    el('segments').open=false;
    el('list').replaceChildren();
    el('segmentTools').hidden=true;
    el('count').textContent=Object.values(initial.segmentKeys||{}).filter(value=>value===true).length+' selected';
    el('listStatus').textContent='';
    campaign=id;el('heading').textContent=id;el('login').hidden=true;el('editor').hidden=false;el('close').hidden=false;message('');
  }catch{message('Could not open campaign. Check the connection and database access.',true);}
  finally{busy=false;el('access').disabled=false;}
};
  function parseShiftSalary(value){
    const raw = value.trim().replace(',', '.');
    if(raw === '')return null;
    if(!/^\d+(?:\.\d{1,2})?$/.test(raw))throw new Error('Enter a valid salary with up to 2 decimal places.');
    const cents = Math.round(Number(raw) * 100);
    if(!Number.isSafeInteger(cents) || cents > 100000000)throw new Error('Enter a salary between €0 and €1,000,000.');
    return cents;
  }
function changes(){
  const patch={}, now=Date.now(), raw=el('target').value.trim();
  if(raw!==String(initial.targetDots??'')){
    const n=Number(raw);
    if(!Number.isInteger(n)||n<1||n>10000000)throw Error('Enter a dot target from 1 to 10,000,000.');
    Object.assign(patch,{targetDots:n,updatedBy:'admin',updatedAt:now});
  }
  const cents=parseShiftSalary(el('salary').value);
  if(cents!==(initial.shiftSalaryCents??null))Object.assign(patch,{shiftSalaryCents:cents,salaryUpdatedAt:now,salaryUpdatedBy:'admin'});
  for(const box of selected()){
    if(box.checked===Boolean(initial.segmentKeys?.[box.value]))continue;
    patch['segmentKeys/'+box.value]=box.checked||null;
    Object.assign(patch,{segmentsUpdatedBy:'admin',segmentsUpdatedAt:now});
  }
  return patch;
}
el('editor').onsubmit=async e=>{
  e.preventDefault();if(busy||!campaign)return;
  let patch;
  try{patch=changes();}catch(err){message(err.message,true);return;}
  if(!Object.keys(patch).length){message('No changes to save.');return;}
  busy=true;el('fields').disabled=true;el('close').disabled=true;message('Saving…');
  try{
    await api.update(api.ref(db,'users/'+campaign+'/campaignSettings'),patch);
    for(const [key,value] of Object.entries(patch)){
      if(key.startsWith('segmentKeys/')){initial.segmentKeys??={};initial.segmentKeys[key.slice(12)]=value;}
      else initial[key]=value;
    }
    message('Saved for '+campaign+'.');
  }catch{message('Save failed. Your edits are still here. Try again.',true);}
  finally{busy=false;el('fields').disabled=false;el('close').disabled=false;}
};
try{
  const [{initializeApp},database]=await Promise.all([import('https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js'),import('https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js')]);
  api=database;
  db=api.getDatabase(initializeApp({
    apiKey: "AIzaSyA6w6auszWRniQfZCjb4nXE_bq9Mzt9dOs",
    authDomain: "betbtc-6d881.firebaseapp.com",
    databaseURL: "https://betbtc-6d881-default-rtdb.firebaseio.com",
    projectId: "betbtc-6d881",
    storageBucket: "betbtc-6d881.firebasestorage.app",
    messagingSenderId: "962176232122",
    appId: "1:962176232122:web:a277d922543c3378033083",
    measurementId: "G-V4XNB7K1E0"
  }));
  polyDb=api.getDatabase(initializeApp({
    apiKey: "AIzaSyBHRyOy3hNcWarK8Zk34MWrv_tIYKM7mXM",
    authDomain: "leuvenflyers-23584.firebaseapp.com",
    databaseURL: "https://leuvenflyers-23584-default-rtdb.firebaseio.com",
    projectId: "leuvenflyers-23584"
  },'segments'));
  el('open').disabled=false;message('');
}catch{message('Could not connect. Check your internet connection and reload.',true);}
</script></body></html>


<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f7f8fb">
<title>LeuvenFlyers Training App</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..24,400,0,0" rel="stylesheet">
<style>
:root{
  --bg:#f7f8fb;
  --surface:#ffffff;
  --surface-2:#fbfbfd;
  --text:#202631;
  --muted:#69727d;
  --faint:#9299a4;
  --line:#e5e7eb;
  --gold:#d8b411;
  --gold-soft:#fff8d9;
  --lav:#c9c6eb;
  --lav-soft:#f3f1fb;
  --blue:#2563eb;
  --blue-soft:#edf4ff;
  --green:#168464;
  --green-soft:#edf8f4;
  --red:#d94d58;
  --red-soft:#fff0f1;
  --orange:#ee9b38;
  --orange-soft:#fff5e7;
  --shadow:0 18px 45px rgba(29,35,48,.09);
}

*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{
  margin:0;
  min-height:100vh;
  background:
    radial-gradient(circle at 92% 2%,rgba(201,198,235,.35),transparent 28%),
    radial-gradient(circle at 4% 96%,rgba(216,180,17,.12),transparent 25%),
    var(--bg);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
  -webkit-font-smoothing:antialiased;
}
button,a{-webkit-tap-highlight-color:transparent}
button{font:inherit}
a{color:inherit}
.app{
  width:min(100%,520px);
  min-height:100vh;
  margin:0 auto;
  padding:18px 16px calc(108px + env(safe-area-inset-bottom));
}
.topbar{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:18px;
}
.brand{
  min-width:0;
  display:flex;
  align-items:center;
  gap:10px;
}
.brand-mark{
  width:42px;
  height:42px;
  display:grid;
  place-items:center;
  flex:0 0 auto;
  border:1px solid #ddd8ec;
  border-radius:12px;
  background:linear-gradient(145deg,#fff,#f2effa);
  box-shadow:0 7px 18px rgba(50,43,74,.08);
}
.brand-mark svg{width:24px;height:24px}
.brand-copy{min-width:0}
.brand-copy strong{
  display:block;
  font-size:16px;
  letter-spacing:-.035em;
}
.brand-copy span{
  display:block;
  margin-top:1px;
  color:var(--muted);
  font-size:10px;
}
.step-count{
  margin-left:auto;
  flex:0 0 auto;
  padding:7px 10px;
  border:1px solid var(--line);
  border-radius:999px;
  background:rgba(255,255,255,.82);
  color:#626b76;
  font-size:10px;
  font-weight:700;
}

.progress-card{
  padding:13px;
  border:1px solid var(--line);
  border-radius:15px;
  background:rgba(255,255,255,.82);
  backdrop-filter:blur(10px);
  box-shadow:0 8px 25px rgba(29,35,48,.04);
}
.progress-meta{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:9px;
}
.progress-meta strong{font-size:11px}
.progress-meta span{color:var(--muted);font-size:9px}
.progress-track{
  height:7px;
  overflow:hidden;
  border-radius:999px;
  background:#eceef2;
}
.progress{
  width:0;
  height:100%;
  border-radius:inherit;
  background:linear-gradient(90deg,var(--gold),#f2d94c,var(--blue));
  transition:width .32s ease;
}
.category-tabs{
  display:flex;
  gap:6px;
  margin-top:10px;
  overflow:auto;
  scrollbar-width:none;
  padding-bottom:1px;
}
.category-tabs::-webkit-scrollbar{display:none}
.category-pill{
  white-space:nowrap;
  padding:5px 8px;
  border:1px solid var(--line);
  border-radius:999px;
  background:#fff;
  color:var(--faint);
  font-size:8px;
  font-weight:700;
  letter-spacing:.06em;
}
.category-pill.active{
  background:var(--lav-soft);
  border-color:#d9d4ec;
  color:#695f87;
}

.stage{
  margin-top:14px;
  perspective:1000px;
}
.card{
  overflow:hidden;
  border:1px solid var(--line);
  border-radius:22px;
  background:var(--surface);
  box-shadow:var(--shadow);
  transform-origin:center bottom;
  animation:cardIn .26s ease;
}
@keyframes cardIn{
  from{opacity:.35;transform:translateY(8px) scale(.985)}
  to{opacity:1;transform:translateY(0) scale(1)}
}
.visual{
  position:relative;
  height:220px;
  overflow:hidden;
  display:grid;
  place-items:center;
  background:linear-gradient(145deg,#f5f3fb,#fdfaf0);
  border-bottom:1px solid var(--line);
}
.visual::before{
  content:"";
  position:absolute;
  width:170px;
  height:170px;
  border-radius:50%;
  background:rgba(255,255,255,.72);
  top:-48px;
  right:-38px;
}
.visual::after{
  content:"";
  position:absolute;
  width:120px;
  height:120px;
  border-radius:50%;
  background:rgba(201,198,235,.15);
  bottom:-48px;
  left:-35px;
}
.scene{
  position:relative;
  z-index:2;
  width:100%;
  height:100%;
  display:grid;
  place-items:center;
}
.scene svg{
  width:88%;
  height:88%;
  max-height:194px;
}
.scene-badge{
  position:absolute;
  z-index:4;
  top:12px;
  left:12px;
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:6px 9px;
  border-radius:999px;
  background:rgba(255,255,255,.9);
  border:1px solid rgba(222,224,231,.9);
  color:#645c80;
  font-size:8px;
  font-weight:800;
  letter-spacing:.08em;
  backdrop-filter:blur(8px);
}
.scene-badge::before{
  content:"";
  width:6px;
  height:6px;
  border-radius:50%;
  background:var(--gold);
}

.card-body{padding:20px}
.kicker{
  font-size:9px;
  font-weight:800;
  letter-spacing:.12em;
  text-transform:uppercase;
  color:#72688d;
}
.card-title{
  margin:8px 0 0;
  font-size:25px;
  line-height:1.12;
  letter-spacing:-.045em;
  font-weight:600;
}
.card-text{
  margin:11px 0 0;
  color:var(--muted);
  font-size:13px;
  line-height:1.75;
}
.points{
  display:grid;
  gap:8px;
  margin-top:14px;
}
.point{
  display:grid;
  grid-template-columns:26px 1fr;
  gap:9px;
  align-items:start;
  padding:10px 11px;
  border:1px solid var(--line);
  border-radius:11px;
  background:var(--surface-2);
}
.point-num{
  width:26px;
  height:26px;
  display:grid;
  place-items:center;
  border-radius:8px;
  background:var(--lav-soft);
  color:#665d80;
  font-size:9px;
  font-weight:800;
}
.point strong{
  display:block;
  font-size:11px;
  line-height:1.4;
}
.point span{
  display:block;
  margin-top:2px;
  color:var(--muted);
  font-size:10px;
  line-height:1.55;
}
.callout{
  margin-top:14px;
  padding:12px 13px;
  border-radius:12px;
  border:1px solid #ece6cc;
  background:var(--gold-soft);
}
.callout.red{border-color:#f2d2d5;background:var(--red-soft)}
.callout.green{border-color:#d5ece4;background:var(--green-soft)}
.callout.blue{border-color:#d7e4fb;background:var(--blue-soft)}
.callout strong{display:block;font-size:10px}
.callout span{display:block;margin-top:3px;color:#5e6671;font-size:10px;line-height:1.55}
.action-link{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  min-height:48px;
  margin-top:14px;
  padding:11px 13px;
  border:1px solid #d9d3ed;
  border-radius:12px;
  background:var(--lav-soft);
  color:#514966;
  text-decoration:none;
  font-size:11px;
  font-weight:700;
}
.action-link span:last-child{
  display:grid;
  place-items:center;
  width:28px;
  height:28px;
  border-radius:8px;
  background:#fff;
}

.navbar{
  position:fixed;
  z-index:30;
  left:50%;
  bottom:max(12px,env(safe-area-inset-bottom));
  transform:translateX(-50%);
  width:min(calc(100% - 28px),492px);
  display:grid;
  grid-template-columns:1fr 1.35fr;
  gap:9px;
  padding:9px;
  border:1px solid rgba(221,224,230,.96);
  border-radius:18px;
  background:rgba(255,255,255,.93);
  backdrop-filter:blur(16px);
  box-shadow:0 16px 40px rgba(25,33,45,.16);
}
.nav-btn{
  min-height:50px;
  border:1px solid var(--line);
  border-radius:12px;
  background:#fff;
  color:#4f5965;
  font-size:12px;
  font-weight:700;
}
.nav-btn.next{
  border-color:transparent;
  background:var(--gold);
  color:#2f2d1b;
}
.nav-btn:disabled{opacity:.38;cursor:default}
.nav-btn:not(:disabled):active{transform:scale(.985)}

.finish{
  text-align:center;
}
.finish-icon{
  width:70px;
  height:70px;
  margin:2px auto 16px;
  display:grid;
  place-items:center;
  border-radius:20px;
  background:var(--green-soft);
  border:1px solid #d7ece5;
}
.finish-icon svg{width:34px;height:34px}
.finish .card-title{font-size:28px}
.finish .card-text{max-width:350px;margin-left:auto;margin-right:auto}

@media(min-width:560px){
  .app{padding-top:30px}
  .visual{height:250px}
  .card-body{padding:24px}
}
@media(prefers-reduced-motion:reduce){
  *{scroll-behavior:auto!important;animation:none!important;transition:none!important}
}

/* =========================================================
   MOBILE-FIRST COMPACT REFINEMENT
   UI text is intentionally capped at 12px.
========================================================= */
.material-symbols-outlined{
  font-family:'Material Symbols Outlined';
  font-weight:normal;
  font-style:normal;
  font-size:16px;
  line-height:1;
  letter-spacing:normal;
  text-transform:none;
  display:inline-block;
  white-space:nowrap;
  word-wrap:normal;
  direction:ltr;
  -webkit-font-feature-settings:'liga';
  -webkit-font-smoothing:antialiased;
  font-feature-settings:'liga';
}
body{
  font-size:10px;
  overflow-x:hidden;
  background:
    radial-gradient(circle at 100% 0,rgba(201,198,235,.28),transparent 26%),
    radial-gradient(circle at 0 100%,rgba(216,180,17,.09),transparent 24%),
    #f7f8fb;
}
.app{
  width:min(100%,460px);
  padding:10px 10px calc(72px + env(safe-area-inset-bottom));
}
.topbar{
  gap:8px;
  margin-bottom:8px;
  min-height:34px;
}
.brand{gap:7px}
.brand-mark{
  width:32px;
  height:32px;
  border-radius:9px;
  box-shadow:none;
}
.brand-mark .material-symbols-outlined{font-size:18px;color:#665d80}
.brand-copy strong{
  font-size:12px;
  line-height:1.15;
  letter-spacing:-.025em;
}
.brand-copy span{
  margin-top:1px;
  font-size:8px;
  line-height:1.2;
}
.step-count{
  padding:5px 7px;
  font-size:8px;
}
.progress-card{
  padding:8px;
  border-radius:11px;
  box-shadow:none;
}
.progress-meta{margin-bottom:6px}
.progress-meta strong{font-size:9px}
.progress-meta span{font-size:8px}
.progress-track{height:5px}
.category-tabs{gap:5px;margin-top:7px}
.category-pill{
  display:inline-flex;
  align-items:center;
  gap:3px;
  padding:4px 6px;
  font-size:7px;
}
.category-pill .material-symbols-outlined{font-size:11px}
.stage{margin-top:8px}
.card{
  border-radius:14px;
  box-shadow:0 10px 28px rgba(29,35,48,.07);
}
.visual{
  height:142px;
  min-height:142px;
}
.visual::before{width:110px;height:110px;top:-42px;right:-30px}
.visual::after{width:82px;height:82px;bottom:-34px;left:-24px}
.scene svg{
  width:82%;
  height:82%;
  max-height:124px;
}
.scene-badge{
  top:7px;
  left:7px;
  gap:3px;
  padding:4px 6px;
  font-size:7px;
}
.scene-badge::before{display:none}
.scene-badge .material-symbols-outlined{font-size:11px}
.card-body{padding:11px}
.kicker{
  display:flex;
  align-items:center;
  gap:4px;
  font-size:7px;
  line-height:1.2;
}
.kicker .material-symbols-outlined{font-size:11px}
.card-title{
  margin-top:5px;
  font-size:12px;
  line-height:1.28;
  letter-spacing:-.015em;
  font-weight:700;
}
.card-text{
  margin-top:6px;
  font-size:10px;
  line-height:1.5;
}
.points{
  gap:5px;
  margin-top:8px;
}
.point{
  grid-template-columns:22px 1fr;
  gap:7px;
  padding:7px 8px;
  border-radius:8px;
}
.point-num{
  width:22px;
  height:22px;
  border-radius:6px;
}
.point-num .material-symbols-outlined{font-size:12px}
.point strong{font-size:9px;line-height:1.3}
.point span{margin-top:1px;font-size:8px;line-height:1.4}
.callout{
  display:grid;
  grid-template-columns:22px 1fr;
  gap:7px;
  align-items:start;
  margin-top:8px;
  padding:8px;
  border-radius:9px;
}
.callout-icon{
  width:22px;
  height:22px;
  display:grid;
  place-items:center;
  border-radius:7px;
  background:rgba(255,255,255,.72);
  font-size:13px;
}
.callout strong{font-size:9px;line-height:1.3}
.callout span:not(.callout-icon){margin-top:1px;font-size:8px;line-height:1.4}
.action-link{
  min-height:40px;
  margin-top:8px;
  padding:7px 8px 7px 10px;
  border-radius:9px;
  font-size:9px;
}
.action-copy{
  display:flex;
  align-items:center;
  gap:6px;
}
.action-copy .material-symbols-outlined{font-size:13px}
.action-arrow{
  width:24px!important;
  height:24px!important;
  border-radius:7px!important;
  font-size:14px!important;
}
.navbar{
  bottom:max(6px,env(safe-area-inset-bottom));
  width:min(calc(100% - 16px),444px);
  grid-template-columns:.88fr 1.12fr;
  gap:6px;
  padding:6px;
  border-radius:13px;
  box-shadow:0 10px 28px rgba(25,33,45,.13);
}
.nav-btn{
  min-height:42px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:5px;
  border-radius:9px;
  font-size:10px;
}
.nav-btn .material-symbols-outlined{font-size:15px}
.finish-icon{
  width:48px;
  height:48px;
  margin:0 auto 9px;
  border-radius:13px;
}
.finish-icon .material-symbols-outlined{
  font-size:26px;
  color:#168464;
}
.finish .card-title{font-size:12px}
.finish .card-text{max-width:320px}
@media(min-width:380px){
  .points.two-col{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:340px){
  .app{padding-left:8px;padding-right:8px}
  .brand-copy span{display:none}
  .visual{height:132px;min-height:132px}
  .scene svg{max-height:116px}
  .card-body{padding:9px}
  .navbar{width:calc(100% - 12px)}
}
@media(min-width:560px){
  .app{padding-top:12px}
  .visual{height:150px}
  .card-body{padding:12px}
}

</style>
</head>

<body>
<div class="app">
  <div class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"><span class="material-symbols-outlined">route</span></span>
      <div class="brand-copy">
        <strong>LeuvenFlyers Training</strong>
        <span>Field onboarding · mobile guide</span>
      </div>
    </div>
    <span class="step-count" id="stepCount">1 / 24</span>
  </div>

  <div class="progress-card">
    <div class="progress-meta">
      <strong id="progressTitle">Getting started</strong>
      <span id="progressPercent">0%</span>
    </div>
    <div class="progress-track" aria-label="Training progress">
      <div class="progress" id="progress"></div>
    </div>
    <div class="category-tabs" id="categoryTabs"></div>
  </div>

  <div class="stage">
    <article class="card" id="card">
      <div class="visual">
        <div class="scene-badge"><span class="material-symbols-outlined" id="sceneBadgeIcon">settings</span><span id="sceneBadge">SETUP</span></div>
        <div class="scene" id="scene"></div>
      </div>
      <div class="card-body" id="content"></div>
    </article>
  </div>
</div>

<div class="navbar">
  <button class="nav-btn back" id="backBtn" type="button"><span class="material-symbols-outlined">arrow_back</span><span>Back</span></button>
  <button class="nav-btn next" id="nextBtn" type="button"><span>Next</span><span class="material-symbols-outlined">arrow_forward</span></button>
</div>

<script>
const APP_URL = "http://leuvenflyers.com/ms2500";

const steps = [
  {
    category:"Setup", title:"Open the Flyer App",
    text:"Start by opening the LeuvenFlyers flyer app used for your training session.",
    scene:"app",
    link:{label:"Open Flyer App",url:APP_URL},
    points:[["New app","Use the current LeuvenFlyers flyer app for your training."]]
  },
  {
    category:"Setup", title:"Ask for your FF ID",
    text:"Open the staff chat and ask the team for the FF ID assigned to your training campaign.",
    scene:"chat",
    callout:{type:"blue",title:"Message the team",text:'Ask: “What is my FF ID?”'}
  },
  {
    category:"Setup", title:"Enter your FF ID",
    text:"Enter the FF ID you received from the team into the flyer app.",
    scene:"id",
    points:[["Check carefully","Make sure the campaign ID matches exactly before continuing."]]
  },
  {
    category:"Setup", title:"Ask for the SEG number",
    text:"Ask the staff team for the SEG number of the route you need to train on.",
    scene:"chat",
    callout:{type:"blue",title:"Message the team",text:'Ask: “What SEG number should I use?”'}
  },
  {
    category:"Setup", title:"Enter the SEG and focus the route",
    text:"Enter the SEG number in the app and tap Focus so the correct route is shown clearly.",
    scene:"map",
    points:[["SEG","Enter the segment number."],["Focus","Tap Focus to center the assigned route."]]
  },
  {
    category:"Setup", title:"Go to the start point",
    text:"Travel to the start of your assigned segment. The start point is shown by the red box.",
    scene:"start",
    callout:{type:"red",title:"Do not start early",text:"Reach the red start box first."}
  },
  {
    category:"Setup", title:"Tell the team you arrived",
    text:'When you are at the start point, send a message in staff chat.',
    scene:"chat",
    callout:{type:"blue",title:"Send this message",text:'“I am at start point of my seg.”'}
  },
  {
    category:"Setup", title:"Start your session",
    text:"Tap the Start button in the app and enter your name when requested.",
    scene:"startbutton",
    points:[["Start","Tap the Start button."],["Name","Enter your name correctly."]]
  },
  {
    category:"Setup", title:"Wait for permission",
    text:"Wait until the team gives you permission to begin the training.",
    scene:"wait",
    callout:{type:"green",title:"Start only after approval",text:'Wait for the message: “start your training”.'}
  },

  {
    category:"Rules", title:"Follow the purple line",
    text:"Your assigned path is the purple route shown in the app. Follow it through the segment.",
    scene:"purpleRoute",
    callout:{type:"blue",title:"Route rule",text:"Stay with the assigned purple line."}
  },
  {
    category:"Rules", title:"Only cover the assigned side",
    text:"Distribute only to buildings above which the purple line is going. Do not cross to the opposite side of the road.",
    scene:"side",
    callout:{type:"red",title:"Important",text:"Do not distribute on the opposite side of the road."}
  },
  {
    category:"Rules", title:"Green button = mailbox found",
    text:"When you see a mailbox, click the Green button.",
    scene:"green",
    callout:{type:"green",title:"Green button",text:"Use it when you find a mailbox."}
  },
  {
    category:"Rules", title:"Orange button = confirm delivery",
    text:"After putting the flyer in the mailbox, click the Orange button to confirm the delivery. During training, pretend that you have flyers in hand.",
    scene:"orange",
    callout:{type:"gold",title:"Training simulation",text:"Pretend the flyer was placed in the mailbox, then confirm."}
  },
  {
    category:"Rules", title:"Multiple mailboxes",
    text:"If one building contains several mailboxes, repeat the process for each mailbox.",
    scene:"multi",
    points:[["1","Click Green for a mailbox."],["2","Put the flyer in."],["3","Click Orange to confirm."],["Repeat","Do this once for every mailbox."]]
  },
  {
    category:"Rules", title:"Green and Orange must match",
    text:"Every Green button click represents one flyer and must be followed by one Orange button click.",
    scene:"equal",
    callout:{type:"red",title:"Strict rule",text:"Green clicks must be equal to Orange clicks."}
  },
  {
    category:"Rules", title:"Red sticker rule",
    text:"If a mailbox has a red sticker, click the Red button. Do not put a flyer in that mailbox and do not click Orange.",
    scene:"red",
    callout:{type:"red",title:"Red sticker",text:"Red button → no flyer → no Orange confirmation."}
  },
  {
    category:"Rules", title:"Find the mailboxes on your route",
    text:"Look for all mailboxes along the assigned route. You may enter buildings when the doors are open.",
    scene:"mailboxes",
    points:[["Stay on route","Work only along the assigned segment."],["Open entrances","You may enter when a building door is already open."]]
  },
  {
    category:"Rules", title:"Finish the segment",
    text:"When you reach the end of the SEG, tell the team in staff chat.",

  },

function esc(s){
  return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
}

function renderTabs(){
  const active = steps[current].category;
  els.tabs.innerHTML = categories.map(cat =>
    `<span class="category-pill ${cat===active?'active':''}"><span class="material-symbols-outlined">${categoryIcons[cat]||"circle"}</span>${esc(cat)}</span>`
  ).join("");
  const activePill = els.tabs.querySelector(".category-pill.active");
  if(activePill) activePill.scrollIntoView({behavior:"smooth",inline:"center",block:"nearest"});
}

function render(){
  completed = false;
  const s = steps[current];
  const pct = Math.round((current/(steps.length-1))*100);

  els.progress.style.width = pct + "%";
  els.percent.textContent = pct + "%";
  els.count.textContent = `${current+1} / ${steps.length}`;
  els.title.textContent = s.category==="Setup" ? "Getting started" :
                          s.category==="Rules" ? "Distribution rules" :
                          s.category==="Earnings" ? "Shift & earnings" :
                          s.category==="Payment" ? "Payment setup" : "Final information";
  els.badge.textContent = s.category.toUpperCase();
  els.badgeIcon.textContent = sceneIcons[s.scene] || categoryIcons[s.category] || "info";
  els.scene.innerHTML = graphic(s.scene);

  let body = `<div class="kicker"><span class="material-symbols-outlined">${categoryIcons[s.category]||"circle"}</span><span>${esc(s.category)} · Step ${current+1}</span></div>
              <h2 class="card-title">${esc(s.title)}</h2>
              <p class="card-text">${esc(s.text)}</p>`;

  if(s.points){
    body += `<div class="points">${s.points.map((p,i)=>`
      <div class="point">
        <span class="point-num"><span class="material-symbols-outlined">check</span></span>
        <div><strong>${esc(p[0] || String(i+1))}</strong><span>${esc(p[1])}</span></div>
      </div>`).join("")}</div>`;
  }

  if(s.callout){
    const cls = s.callout.type==="gold" ? "" : s.callout.type;
    const calloutIcon = s.callout.type==="red" ? "warning" :
                        s.callout.type==="green" ? "check_circle" :
                        s.callout.type==="blue" ? "info" : "tips_and_updates";
    body += `<div class="callout ${cls}">
      <span class="callout-icon material-symbols-outlined">${calloutIcon}</span>
      <div><strong>${esc(s.callout.title)}</strong><span>${esc(s.callout.text)}</span></div>
    </div>`;
  }

  if(s.link){
    body += `<a class="action-link" href="${esc(s.link.url)}" target="_blank" rel="noopener noreferrer">
      <span class="action-copy"><span class="material-symbols-outlined">open_in_new</span>${esc(s.link.label)}</span>
      <span class="material-symbols-outlined action-arrow">chevron_right</span>
    </a>`;
  }

  els.content.innerHTML = body;
  els.back.disabled = current===0;
  els.next.innerHTML = current===steps.length-1
    ? '<span>Finish</span><span class="material-symbols-outlined">check</span>'
    : '<span>Next</span><span class="material-symbols-outlined">arrow_forward</span>';
  renderTabs();
  localStorage.setItem("lfTrainingStep", String(current));

  els.card.style.animation = "none";
  void els.card.offsetWidth;
  els.card.style.animation = "";
  window.scrollTo({top:0,behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"});
}

function nextStep(){
  if(completed) return;
  if(current < steps.length-1){
    current++;
    render();
  }else{
    completed = true;
    els.scene.innerHTML = `<div class="finish-icon"><span class="material-symbols-outlined">task_alt</span></div>`;
    els.badge.textContent = "COMPLETE";
    els.badgeIcon.textContent = "task_alt";
    els.content.innerHTML = `<div class="finish">
      <div class="kicker"><span class="material-symbols-outlined">verified</span><span>Training completed</span></div>
      <h2 class="card-title">You reached the end.</h2>
      <p class="card-text">Keep the staff app nearby for campaign opportunities and ask the LeuvenFlyers team in chat whenever you need help.</p>
      <a class="action-link" href="https://www.leuvenflyers.com/staff" target="_blank" rel="noopener noreferrer"><span class="action-copy"><span class="material-symbols-outlined">open_in_new</span>Open Staff App</span><span class="material-symbols-outlined action-arrow">chevron_right</span></a>
    </div>`;
    els.next.disabled = true;
    els.next.innerHTML = '<span>Done</span><span class="material-symbols-outlined">check</span>';
    els.back.disabled = false;
    els.progress.style.width = "100%";
    els.percent.textContent = "100%";
    els.count.textContent = `${steps.length} / ${steps.length}`;
  }
}

function prevStep(){
  if(completed){
    completed = false;
    els.next.disabled = false;
    render();
    return;
  }
  if(current>0){
    current--;
    els.next.disabled=false;
    render();
  }
}

els.next.addEventListener("click", nextStep);
els.back.addEventListener("click", prevStep);

document.addEventListener("keydown",e=>{
  if(e.key==="ArrowRight") nextStep();
  if(e.key==="ArrowLeft") prevStep();
});

let touchStartX=0;
document.addEventListener("touchstart",e=>{touchStartX=e.changedTouches[0].clientX},{passive:true});
document.addEventListener("touchend",e=>{
  const dx=e.changedTouches[0].clientX-touchStartX;
  if(Math.abs(dx)<60)return;
  if(dx<0) nextStep(); else prevStep();
},{passive:true});

render();
</script>
</body>
</html>

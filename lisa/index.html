<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0b0e">
  <title>Registration List</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 20px 12px; background: #0b0b0e; color: #f8fafc; font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { max-width: 1000px; margin: 0 auto; overflow-x: auto; border: 1px solid #2a2a35; border-radius: 8px; background: #15151a; }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th, td { padding: 14px 16px; border-bottom: 1px solid #2a2a35; }
    th { color: #9ca3af; font-size: 12px; font-weight: 600; white-space: nowrap; }
    td { overflow-wrap: anywhere; }
    td:nth-child(3), td:nth-child(4) { white-space: nowrap; font-variant-numeric: tabular-nums; }
    tr:last-child td { border-bottom: 0; }
    .status { text-align: center; color: #9ca3af; padding: 30px 16px; }
    @media (max-width: 480px) { body { padding: 12px 6px; font-size: 12px; } th, td { padding: 12px 7px; } th { font-size: 11px; } }
  </style>
</head>
<body>
<main>
  <table aria-label="Registrations, newest first">
    <thead><tr><th scope="col">First name</th><th scope="col">Last name</th><th scope="col">ID number</th><th scope="col">Date</th></tr></thead>
    <tbody id="entries"><tr><td colspan="4" class="status">Loading...</td></tr></tbody>
  </table>
</main>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
  import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";
  const firebaseConfig = {
    apiKey: "AIzaSyBuBB-Cha7eLG1O7SxOTfFt8e6hVAWjkxI",
    authDomain: "tokentransfer-4a9b3.firebaseapp.com",
    databaseURL: "https://tokentransfer-4a9b3-default-rtdb.firebaseio.com",
    projectId: "tokentransfer-4a9b3",
    storageBucket: "tokentransfer-4a9b3.firebasestorage.app"
  };
  const db = getDatabase(initializeApp(firebaseConfig));
  const entries = document.getElementById('entries');
  const dateFormatter = new Intl.DateTimeFormat('en-GB', {
    day: '2-digit', month: '2-digit', year: 'numeric', timeZone: 'Europe/Brussels'
  });

  // Use submission time; older entries without it fall back to their stored date.
  function entryTime(entry) {
    const timestamp = Number(entry.timestamp);
    if (Number.isFinite(timestamp) && timestamp > 0 && !Number.isNaN(new Date(timestamp).getTime())) return timestamp;
    const fallback = typeof entry.date === 'string' ? Date.parse(entry.date) : NaN;
    return Number.isFinite(fallback) ? fallback : 0;
  }

  function formatId(value) {
    const id = String(value ?? '');
    const digits = id.replace(/\D/g, '');
    return digits.length === 11
      ? `${digits.slice(0, 2)}.${digits.slice(2, 4)}.${digits.slice(4, 6)}-${digits.slice(6, 9)}.${digits.slice(9)}`
      : id || '—';
  }

  function showStatus(message) {
    const row = document.createElement('tr');
    const cell = document.createElement('td');
    cell.colSpan = 4;
    cell.className = 'status';
    cell.textContent = message;
    row.appendChild(cell);
    entries.replaceChildren(row);
  }

  function render(data) {
    const sorted = Object.entries(data || {})
      .filter(([, entry]) => entry && typeof entry === 'object')
      .map(([key, entry]) => ({ key, entry, time: entryTime(entry) }))
      .sort((a, b) => b.time - a.time || b.key.localeCompare(a.key));
    if (!sorted.length) return showStatus('No entries yet.');
    const fragment = document.createDocumentFragment();
    for (const { entry, time } of sorted) {
      const row = document.createElement('tr');
      const values = [entry.firstName || '—', entry.lastName || '—', formatId(entry.belgiumId), time ? dateFormatter.format(new Date(time)) : '—'];
      for (const value of values) {
        const cell = document.createElement('td');
        cell.textContent = String(value);
        row.appendChild(cell);
      }
      fragment.appendChild(row);
    }
    entries.replaceChildren(fragment);
  }

  onValue(ref(db, 'userSubmissions'), snapshot => render(snapshot.val()), () => {
    showStatus('Unable to load entries. Please reload to try again.');
  });
</script>
</body>
</html>
